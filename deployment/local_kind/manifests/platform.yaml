# 로컬 executor 재현에 필요한 클러스터 내부 구성.
# __API_IMAGE__는 deploy.sh가 .state/images.env의 digest로 바꿔 넣는다.
#
# - orch-system: Postgres, Experiment API, launcher (운영의 플랫폼 영역)
# - experiments: executor Job만 뜨는 곳. 운영과 같은 Pod Security "restricted"를 강제한다.
apiVersion: v1
kind: Namespace
metadata:
  name: orch-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: experiments
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: experiment-executor
  namespace: experiments
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: launcher
  namespace: orch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launcher-jobs
  namespace: experiments
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launcher-jobs
  namespace: experiments
subjects:
  - kind: ServiceAccount
    name: launcher
    namespace: orch-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launcher-jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: orch-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - {name: POSTGRES_USER, value: orch}
            - {name: POSTGRES_PASSWORD, value: orch}
            - {name: POSTGRES_DB, value: autoresearch}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orch", "-d", "autoresearch"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orch-system
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-api
  namespace: orch-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: experiment-api}
  template:
    metadata:
      labels: {app: experiment-api}
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          envFrom:
            - secretRef:
                name: api-env
          env:
            - {name: ORCH_RUNTIME_DIR, value: /run/orch}
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 3
          volumeMounts:
            - name: runtime
              mountPath: /run/orch
              readOnly: true
      volumes:
        - name: runtime
          secret:
            secretName: api-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: experiment-api
  namespace: orch-system
spec:
  selector: {app: experiment-api}
  ports:
    - port: 8000
