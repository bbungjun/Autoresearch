# 의존성 단일 출처. uv 로 관리한다 (uv sync / uv lock).
# applications/youtube_api_proxy/requirements.txt(Cloud Run)는 uv.lock export 산출물이다 — 직접 수정 금지.
# deployment/Dockerfile.app은 이 파일과 uv.lock을 build 중 직접 읽는다.

[project]
name = "autoresearch"
version = "0.1.0"
description = "YouTube 트렌딩 데이터 기반 CTR 모델링 프로젝트"
readme = "README.md"
requires-python = ">=3.11"
# 애플리케이션·공개 batch CLI 런타임 의존성.
dependencies = [
    "pydantic>=2.6,<3",
    "pyarrow>=15.0",
    "google-api-python-client>=2.100,<3",
    "google-cloud-storage>=2.10",
    "google-cloud-bigquery>=3.20",
    "db-dtypes>=1.2",
    "gcsfs>=2024.0",
    "tenacity>=8.2,<10",
    "requests>=2.32,<3",
    "openai>=1.66,<3",
    # CTR Model Training (Issue #33)
    "duckdb>=0.8.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "PyYAML>=6.0",
    "joblib>=1.3.0",
    "typer>=0.9.0",
    # 구조화 JSON 로깅(#352): stdout 한 줄 JSON — Filebeat ndjson 수집 계약.
    "python-json-logger>=3.2,<4",
    "mlflow-skinny==2.22.1",
    # 모델 바이너리 ONNX 전환(#302/#179): 학습 시 LightGBM→ONNX 변환(onnxmltools),
    # 서빙 시 onnxruntime 추론(pickle 역직렬화 위험 제거).
    "onnxmltools>=1.12",
    "onnxruntime>=1.18",
    "pandas>=2.0,<3",
    # deployment/mlflow/runtime과 동일하게 고정: protobuf>=7에서 MLflow client가
    # FieldDescriptor.label 오류를 낸다.
    "protobuf<7",
    "google-cloud-aiplatform>=1.148.1",
    # embeddings.py가 재시도 화이트리스트에서 직접 import한다(#426) — 지금까지는
    # google-cloud-aiplatform의 transitive 의존이었지만 직접 의존이므로 명시한다.
    "google-api-core>=2.31.0",
    "google-auth>=2.53.0",
]

[dependency-groups]
# 로컬 Research Harness GPU 추론 전용. 기본 dev/배포 설치에는 포함하지 않는다.
# uv sync --no-default-groups --group local-embedding (프로젝트 .venv)
local-embedding = [
    "torch==2.10.0",
    "sentence-transformers==6.0.1",
    "safetensors>=0.7,<1",
]
# 개발/테스트 + virtual_users(실험) 의존성. `uv sync` 기본 포함.
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8,<4",
    "datasets>=2.19",
    "httpx>=0.28,<0.29",
    "google-cloud-bigquery>=3.20",
    "python-dotenv>=1.0",
    # scripts/bench/degradation_curve_plot.py(#471) 시각화 전용 — 애플리케이션 런타임은
    # 쓰지 않는다.
    "plotly>=5.24,<7",
    { include-group = "lint" },
    { include-group = "serving" },
    { include-group = "orchestration" },
    # Streamlit workbench를 CI 테스트에 포함한다(#536). 폼 렌더링 버그는 순수 함수
    # 테스트로 잡히지 않고 `streamlit.testing.v1.AppTest`가 스크립트를 실제로 실행해야
    # 드러난다. feast와 달리 버전 충돌이 없어 dev에 함께 둘 수 있다.
    { include-group = "orchestration-ui" },
]
# 린트 전용 표면 (CI lint job 은 이 그룹만 설치).
lint = [
    "ruff==0.15.18",
]
# Feast 피처 스토어(feature_repo/) 별도 환경: `uv sync --only-group feast`
feast = [
    "feast[gcp]==0.64.0",
    "google-cloud-bigquery>=3.20",
    "google-cloud-secret-manager>=2.20",
    "redis>=5.0",
    "pandas>=2.0",
    "pyarrow>=21.0.0,<22",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]
# proxy/ (Cloud Run dumb forwarder) 런타임 핀.
# dev 표면과 동일하게 정렬: dev(최대 0.128) 통과 → prod(0.116) 깨짐 버전 발산 방지.
proxy = [
    "fastapi>=0.115,<0.129",
    "uvicorn[standard]>=0.32,<0.35",
    "httpx>=0.28,<0.29",
]
serving = [
    "fastapi>=0.115,<0.129",
    "uvicorn[standard]>=0.32,<0.35",
    "prometheus-client>=0.20,<1",
]
# agent_orchestration/ FastAPI 채팅 저장 서비스 전용 런타임 표면.
orchestration = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<0.129",
    "uvicorn[standard]>=0.32,<0.35",
    "httpx>=0.28,<0.29",
    "PyJWT[crypto]>=2.13,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "openai>=1.66,<3",
    "google-cloud-secret-manager>=2.20,<3",
    "kubernetes>=36,<37",
]
orchestration-ui = [
    # `st.iframe`이 1.60에 들어왔다. 리포트를 srcdoc iframe에 넣는 데 쓰며, 그 이전
    # 버전에는 HTML 문자열을 받는 대체 API가 deprecated된 것뿐이다(#647).
    "streamlit>=1.60,<2",
    # 리포트 md를 HTML로 바꾼다. `html=False`가 raw HTML을 escape하는 것이 이 경로의
    # **유일한 방어**다 — iframe은 격리 경계가 아니다
    # (`docs/specs/2026-08-10-experiment-report-html-workbench.md` 결정 5).
    "markdown-it-py>=4,<5",
]
[tool.pytest.ini_options]
# scripts/ 디렉토리는 실행 스크립트이므로 테스트 수집 경로에서 제외
testpaths = ["tests"]

[tool.uv]
# 의존성 관리만 uv 로 전환하고 패키지 배치 방식(sys.path)은 유지한다(이슈 #80).
# #754 의 디렉터리 재배치는 이 방식을 그대로 두었다 — 설치형 패키지
# (build-system + [project.scripts]) 전환은 여전히 별도 과제다.
package = false
default-groups = ["dev"]
# feast==0.64.0(starlette>=1.0.1)과 dev/proxy 의 fastapi<0.129(starlette<1.0)는
# 공존 불가 — 기존에 requirements-feast.txt 가 별도 venv 였던 이유.
# feast 는 격리 환경으로 선언한다: `uv sync --only-group feast`
conflicts = [
    [{ group = "feast" }, { group = "dev" }],
    [{ group = "feast" }, { group = "proxy" }],
    [{ group = "feast" }, { group = "serving" }],
    [{ group = "feast" }, { group = "orchestration" }],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# 승인된 Windows RTX 3070 Ti baseline. 시스템 드라이버/툴킷은 바꾸지 않는다.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
