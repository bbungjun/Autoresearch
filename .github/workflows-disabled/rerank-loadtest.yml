name: Rerank serving load test

on:
  workflow_dispatch:
    inputs:
      candidate_count:
        description: "요청당 후보 수"
        type: choice
        required: true
        options:
          - 24
          - 200
      benchmark_label:
        description: "비교 실행 구분"
        type: choice
        required: true
        options:
          - baseline
          - optimized
      load_mode:
        description: "closed=동시 VU 고정(개선 전후 A/B), open=도착률 고정(한계·안정성 검증)"
        type: choice
        required: true
        default: closed
        options:
          - closed
          - open
      arrival_rates:
        description: "open 모드에서 순서대로 인가할 초당 도착률 목록 (공백 구분, 예: 20 40 80 160)"
        type: string
        required: false
        default: ""
      max_vus:
        description: "open 모드 부하 생성기 VU 상한 (미지정 시 도착률의 4배)"
        type: string
        required: false
        default: ""
      fixture_version:
        description: "materialize 완료를 확인한 fixture 버전"
        type: string
        required: true
        default: rerank-v1
      serving_image_ref:
        description: "실행 중인 serving image digest ref"
        type: string
        required: true
      serving_git_sha:
        description: "serving image의 Git SHA"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # 모든 실행이 같은 script/settings ConfigMap 이름을 쓰므로 입력과 무관하게 직렬화한다.
  group: rerank-loadtest
  cancel-in-progress: false

jobs:
  loadtest-runner:
    name: Run sequential k6 Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      LOADTEST_NAMESPACE: loadtest
      CANDIDATE_COUNT: ${{ inputs.candidate_count }}
      BENCHMARK_LABEL: ${{ inputs.benchmark_label }}
      LOAD_MODE: ${{ inputs.load_mode }}
      ARRIVAL_RATES: ${{ inputs.arrival_rates }}
      MAX_VUS: ${{ inputs.max_vus }}
      FIXTURE_VERSION: ${{ inputs.fixture_version }}
      SERVING_IMAGE_REF: ${{ inputs.serving_image_ref }}
      SERVING_GIT_SHA: ${{ inputs.serving_git_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate immutable benchmark metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::The load-test identities are bound only to refs/heads/main."
            exit 1
          fi
          if [[ ! "$SERVING_IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::serving_image_ref must be an immutable digest reference."
            exit 1
          fi
          if [[ ! "$SERVING_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::serving_git_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          if [[ ! "$FIXTURE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::fixture_version contains unsupported characters."
            exit 1
          fi
          # 두 모드의 입력은 서로 배타적이다. 잘못 조합하면 실제로 인가된 부하가
          # 무엇이었는지 사후에 알 수 없으므로 실행 전에 막는다.
          if [[ "$LOAD_MODE" == "open" ]]; then
            if [[ -z "${ARRIVAL_RATES// }" ]]; then
              echo "::error::arrival_rates is required when load_mode is open."
              exit 1
            fi
            for rate in $ARRIVAL_RATES; do
              if [[ ! "$rate" =~ ^[1-9][0-9]{0,3}$ ]] || (( rate > 2000 )); then
                echo "::error::arrival_rates must be integers between 1 and 2000; got '$rate'."
                exit 1
              fi
            done
            if [[ -n "${MAX_VUS// }" && ! "$MAX_VUS" =~ ^[1-9][0-9]{0,4}$ ]]; then
              echo "::error::max_vus must be a positive integer."
              exit 1
            fi
          else
            if [[ -n "${ARRIVAL_RATES// }" || -n "${MAX_VUS// }" ]]; then
              echo "::error::arrival_rates and max_vus apply only when load_mode is open."
              exit 1
            fi
          fi

      - name: Authenticate load-test runner with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.RERANK_LOADTEST_RUNNER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get scoped GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          use_dns_based_endpoint: true

      - name: Run VU gates sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner/raw

          capture_diagnostics() {
            local job_name="$1"
            local step="$2"
            local pod_name
            kubectl describe job "$job_name" -n "$LOADTEST_NAMESPACE" \
              > "runner/raw/job-describe-step-${step}.txt" 2>&1 || true
            pod_name="$(kubectl get pods -n "$LOADTEST_NAMESPACE" \
              -l "job-name=${job_name}" -o jsonpath='{.items[0].metadata.name}' \
              2>/dev/null || true)"
            if [[ -n "$pod_name" ]]; then
              kubectl describe pod "$pod_name" -n "$LOADTEST_NAMESPACE" \
                > "runner/raw/pod-describe-step-${step}.txt" 2>&1 || true
              kubectl logs "$pod_name" -n "$LOADTEST_NAMESPACE" \
                > "runner/raw/pod-log-step-${step}.txt" 2>&1 || true
            fi
          }

          write_metadata() {
            local status="$1"
            local job_result="$2"
            local creation_timestamp="$3"
            local completion_timestamp="$4"
            local job_name="$5"
            local step="$6"
            local settings_config_map="$7"
            jq -n \
              --arg status "$status" \
              --arg job_result "$job_result" \
              --arg creation_timestamp "$creation_timestamp" \
              --arg completion_timestamp "$completion_timestamp" \
              --argjson candidate_count "$CANDIDATE_COUNT" \
              --argjson step "$step" \
              --arg load_mode "$LOAD_MODE" \
              --argjson vus "$([[ "$LOAD_MODE" == open ]] && echo null || echo "$step")" \
              --argjson arrival_rate "$([[ "$LOAD_MODE" == open ]] && echo "$step" || echo null)" \
              --arg fixture_version "$FIXTURE_VERSION" \
              --arg benchmark_label "$BENCHMARK_LABEL" \
              --arg serving_image_ref "$SERVING_IMAGE_REF" \
              --arg serving_git_sha "$SERVING_GIT_SHA" \
              --arg job_name "$job_name" \
              --arg settings_config_map "$settings_config_map" \
              '{
                status: $status,
                job_result: $job_result,
                creation_timestamp: $creation_timestamp,
                completion_timestamp: $completion_timestamp,
                candidate_count: $candidate_count,
                step: $step,
                load_mode: $load_mode,
                vus: $vus,
                arrival_rate: $arrival_rate,
                fixture_version: $fixture_version,
                benchmark_label: $benchmark_label,
                serving_image_ref: $serving_image_ref,
                serving_git_sha: $serving_git_sha,
                job_name: $job_name,
                settings_config_map: $settings_config_map
              }' > "runner/raw/metadata-step-${step}.json"
          }

          kubectl create configmap rerank-loadtest-script \
            -n "$LOADTEST_NAMESPACE" \
            --from-file=rerank.js=applications/reranking_api/loadtest/rerank.js \
            --dry-run=client -o yaml \
            | kubectl label --local -f - \
                app.kubernetes.io/part-of=rerank-loadtest -o yaml \
            | kubectl apply -f -

          # 폐루프는 동시 VU를, 개루프는 초당 도착률을 훑는다. 어느 쪽이든 훑는 값
          # 하나가 한 step이고, 그 값이 이 실행의 모든 raw 파일 키가 된다.
          if [[ "$LOAD_MODE" == "open" ]]; then
            read -r -a sweep_steps <<< "$ARRIVAL_RATES"
          else
            sweep_steps=(1 2 4 8)
          fi

          for step in "${sweep_steps[@]}"; do
            if [[ "$LOAD_MODE" == "open" ]]; then
              step_label="rate ${step}/s"
              mode_settings=(
                --from-literal=LOAD_MODE=open
                --from-literal=ARRIVAL_RATE="$step"
              )
              if [[ -n "${MAX_VUS// }" ]]; then
                mode_settings+=(--from-literal=MAX_VUS="$MAX_VUS")
              fi
            else
              step_label="VU ${step}"
              mode_settings=(
                --from-literal=LOAD_MODE=closed
                --from-literal=VUS="$step"
              )
            fi
            settings_config_map="rerank-loadtest-settings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${step}"
            kubectl create configmap "$settings_config_map" \
              -n "$LOADTEST_NAMESPACE" \
              --from-literal=BASE_URL=http://autoresearch-serving.autoresearch.svc.cluster.local:8000 \
              --from-literal=CANDIDATE_COUNT="$CANDIDATE_COUNT" \
              "${mode_settings[@]}" \
              --from-literal=WARMUP_SECONDS=60 \
              --from-literal=MEASURE_SECONDS=300 \
              --from-literal=FIXTURE_VERSION="$FIXTURE_VERSION" \
              --from-literal=BENCHMARK_LABEL="$BENCHMARK_LABEL" \
              --from-literal=SERVING_IMAGE_REF="$SERVING_IMAGE_REF" \
              --from-literal=SERVING_GIT_SHA="$SERVING_GIT_SHA" \
              --dry-run=client -o json \
              | jq '.metadata.labels["app.kubernetes.io/part-of"] = "rerank-loadtest"
                    | .immutable = true' \
              | kubectl create -f -

            job_manifest="runner/job-step-${step}.yaml"
            sed "s/rerank-loadtest-settings-placeholder/${settings_config_map}/g" \
              deployment/loadtest/rerank-k6-job.yaml > "$job_manifest"
            if grep -q "rerank-loadtest-settings-placeholder" "$job_manifest"; then
              echo "::error::settings ConfigMap placeholder was not rendered."
              exit 1
            fi

            job_name="$(kubectl create \
              -f "$job_manifest" \
              -o jsonpath='{.metadata.name}')"
            job_uid="$(kubectl get job "$job_name" \
              -n "$LOADTEST_NAMESPACE" -o jsonpath='{.metadata.uid}')"
            owner_reference_patch="$(jq -nc \
              --arg name "$job_name" \
              --arg uid "$job_uid" \
              '{metadata: {ownerReferences: [{
                apiVersion: "batch/v1",
                kind: "Job",
                name: $name,
                uid: $uid,
                controller: false,
                blockOwnerDeletion: false
              }]}}')"
            if ! kubectl patch configmap "$settings_config_map" \
              -n "$LOADTEST_NAMESPACE" --type=merge \
              -p "$owner_reference_patch"; then
              echo "::error::Could not attach Job ownerReference to $settings_config_map."
              exit 1
            fi
            creation_timestamp="$(kubectl get job "$job_name" \
              -n "$LOADTEST_NAMESPACE" \
              -o jsonpath='{.metadata.creationTimestamp}')"

            result=running
            for _ in $(seq 1 120); do
              result="$(kubectl get job "$job_name" -n "$LOADTEST_NAMESPACE" -o json \
                | jq -r '
                  if any(.status.conditions[]?;
                    .type == "Complete" and .status == "True") then "complete"
                  elif any(.status.conditions[]?;
                    .type == "Failed" and .status == "True") then "failed"
                  else "running"
                  end')"
              if [[ "$result" != "running" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$result" == "running" ]]; then
              result=timeout
            fi
            completion_timestamp="$(kubectl get job "$job_name" \
              -n "$LOADTEST_NAMESPACE" \
              -o jsonpath='{.status.completionTime}' 2>/dev/null || true)"
            if [[ -z "$completion_timestamp" ]]; then
              completion_timestamp="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
            fi
            write_metadata "$result" "$result" "$creation_timestamp" \
              "$completion_timestamp" "$job_name" "$step" "$settings_config_map"

            if [[ "$result" != "complete" ]]; then
              capture_diagnostics "$job_name" "$step"
              echo "::error::Job $job_name ended with state $result."
              exit 1
            fi

            pod_name="$(kubectl get pods -n "$LOADTEST_NAMESPACE" \
              -l "job-name=${job_name}" -o jsonpath='{.items[0].metadata.name}' \
              2>/dev/null || true)"
            if [[ -z "$pod_name" ]]; then
              write_metadata "pod_not_found" "complete" "$creation_timestamp" \
                "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
              capture_diagnostics "$job_name" "$step"
              echo "::error::Pod for Job $job_name was not found."
              exit 1
            fi
            summary_path="runner/raw/k6-summary-${job_name}.json"
            if ! kubectl logs "$pod_name" -n "$LOADTEST_NAMESPACE" > "$summary_path"; then
              write_metadata "summary_retrieval_failed" "complete" "$creation_timestamp" \
                "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
              capture_diagnostics "$job_name" "$step"
              echo "::error::Could not retrieve summary for Job $job_name."
              exit 1
            fi

            if ! jq -e \
              --argjson expected_step "$step" \
              --arg expected_load_mode "$LOAD_MODE" \
              --argjson expected_candidate_count "$CANDIDATE_COUNT" \
              --arg expected_fixture_version "$FIXTURE_VERSION" '
              .metadata.load_mode == $expected_load_mode
              and (
                if $expected_load_mode == "open"
                then .metadata.arrival_rate == $expected_step
                else .metadata.vus == $expected_step
                end
              )
              and .metadata.candidate_count == $expected_candidate_count
              and .metadata.fixture_version == $expected_fixture_version
              and (
              .data.metrics.rerank_measure_failure.values.rate as $rate
              | ($rate | type) == "number" and $rate < 0.01
              )
            ' "$summary_path" >/dev/null; then
              write_metadata "measurement_gate_failed" "complete" "$creation_timestamp" \
                "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
              capture_diagnostics "$job_name" "$step"
              echo "::error::Summary provenance is invalid or failure rate is at least 1%."
              exit 1
            fi

            # 개루프에서 부하 생성기가 목표 도착률을 못 지키면, 그 측정은 서버가
            # 아니라 생성기의 한계를 잰 것이다. 서버 결과로 보고되면 용량을 실제보다
            # 낮게 단정하게 되므로 실패가 아니라 무효로 분류하고, 더 높은 도착률로
            # 진행하지 않는다. 대응은 max_vus를 올려 재실행하는 것이다.
            if [[ "$LOAD_MODE" == "open" ]]; then
              dropped="$(jq -r '
                .data.metrics["dropped_iterations{scenario:measure}"].values.count
                // "missing"' "$summary_path")"
              if [[ "$dropped" == "missing" ]]; then
                write_metadata "dropped_iterations_missing" "complete" "$creation_timestamp" \
                  "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
                capture_diagnostics "$job_name" "$step"
                echo "::error::Measured dropped_iterations is absent from the summary ($step_label)."
                exit 1
              fi
              if (( $(printf '%.0f' "$dropped") > 0 )); then
                write_metadata "invalid_generator_limited" "complete" "$creation_timestamp" \
                  "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
                capture_diagnostics "$job_name" "$step"
                echo "::error::Generator could not sustain the arrival rate ($step_label);" \
                  "dropped_iterations=$dropped. This measures the load generator, not the" \
                  "server: record it as 'invalid; rerun required' and raise max_vus."
                exit 1
              fi
            fi

            write_metadata "succeeded" "complete" "$creation_timestamp" \
              "$completion_timestamp" "$job_name" "$step" "$settings_config_map"
          done

      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-loadtest-runner-${{ github.run_id }}
          path: runner/raw
          if-no-files-found: error
          retention-days: 14

  prometheus-snapshot-reader:
    name: Export raw Prometheus ranges
    needs: loadtest-runner
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # infra의 kube-prometheus-stack releaseName에서 도출한 Service proxy다.
      # live Service/port 존재 검증은 별도 infra 배포 게이트가 담당한다.
      PROMETHEUS_SERVICE_PROXY: /api/v1/namespaces/monitoring/services/http:kube-prometheus-stack-prometheus:9090/proxy
      LOAD_MODE: ${{ inputs.load_mode }}
      ARRIVAL_RATES: ${{ inputs.arrival_rates }}

    steps:
      - name: Download runner evidence
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: rerank-loadtest-runner-${{ github.run_id }}
          path: runner/raw

      - name: Inspect completed Job evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner/raw
          shopt -s nullglob
          metadata_files=(runner/raw/metadata-step-*.json)
          metadata_count=${#metadata_files[@]}
          # 상한은 이 실행이 선언한 sweep 길이다. 폐루프는 VU 1/2/4/8로 고정이고,
          # 개루프는 운영자가 준 도착률 개수다. 초과분은 이전 실행의 잔재이거나
          # 예상 밖 산출물이므로, 조용히 섞어 보고하지 않고 실패시킨다.
          if [[ "$LOAD_MODE" == "open" ]]; then
            read -r -a expected_steps <<< "$ARRIVAL_RATES"
            expected_step_count=${#expected_steps[@]}
          else
            expected_step_count=4
          fi
          if (( metadata_count > expected_step_count )); then
            echo "::error::Expected at most $expected_step_count step metadata files, found $metadata_count."
            exit 1
          fi

          completed_count=0
          for metadata_path in "${metadata_files[@]}"; do
            if jq -e 'select(.job_result == "complete")' \
              "$metadata_path" >/dev/null; then
              completed_count=$((completed_count + 1))
            fi
          done
          echo "completed_count=$completed_count" >> "$GITHUB_OUTPUT"

          if (( completed_count == 0 )); then
            echo "::warning::No completed Job metadata; Prometheus export is skipped."
            jq -n \
              --argjson metadata_count "$metadata_count" \
              '{status: "skipped", reason: "no_completed_job", metadata_count: $metadata_count}' \
              > runner/raw/prometheus-reader-diagnostic.json
          fi

      - name: Authenticate snapshot reader with Workload Identity Federation
        if: steps.evidence.outputs.completed_count != '0'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.RERANK_PROMETHEUS_SNAPSHOT_READER_SA }}

      - name: Set up Cloud SDK
        if: steps.evidence.outputs.completed_count != '0'
        uses: google-github-actions/setup-gcloud@v2

      - name: Get read-only GKE credentials
        if: steps.evidence.outputs.completed_count != '0'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          use_dns_based_endpoint: true

      - name: Query padded Prometheus ranges
        if: steps.evidence.outputs.completed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata_files=()
          for metadata_path in runner/raw/metadata-step-*.json; do
            if jq -e 'select(.job_result == "complete")' \
              "$metadata_path" >/dev/null; then
              metadata_files+=("$metadata_path")
            fi
          done

          declare -A queries=(
            [phase_p50]='histogram_quantile(0.50, sum by (le, phase) (rate(rerank_phase_duration_seconds_bucket{namespace="autoresearch"}[5m])))'
            [phase_p95]='histogram_quantile(0.95, sum by (le, phase) (rate(rerank_phase_duration_seconds_bucket{namespace="autoresearch"}[5m])))'
            [outcome_rate]='sum by (outcome) (rate(rerank_outcomes_total{namespace="autoresearch"}[5m]))'
            [max_in_flight]='max_over_time(rerank_in_flight{namespace="autoresearch"}[5m])'
            [cpu_seconds]='sum(rate(container_cpu_usage_seconds_total{namespace="autoresearch",pod=~"autoresearch-serving-.*",container!="",container!="POD"}[5m]))'
            [rss]='sum(container_memory_rss{namespace="autoresearch",pod=~"autoresearch-serving-.*",container!="",container!="POD"})'
            [cfs_throttling_ratio]='sum by (pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace="autoresearch",pod=~"autoresearch-serving-.*",container!="",container!="POD"}[5m])) / sum by (pod, container) (rate(container_cpu_cfs_periods_total{namespace="autoresearch",pod=~"autoresearch-serving-.*",container!="",container!="POD"}[5m]))'
          )

          query_names=(
            phase_p50
            phase_p95
            outcome_rate
            max_in_flight
            cpu_seconds
            rss
            cfs_throttling_ratio
          )
          if (( ${#query_names[@]} != ${#queries[@]} )); then
            echo "::error::query_names(${#query_names[@]}) and queries(${#queries[@]}) are out of sync"
            exit 1
          fi
          declare -A query_name_set=()
          for query_name in "${query_names[@]}"; do
            if [[ -n ${query_name_set[$query_name]+x} ]]; then
              echo "::error::query_names contains a duplicate: $query_name"
              exit 1
            fi
            query_name_set[$query_name]=1
            if [[ -z ${queries[$query_name]+x} ]]; then
              echo "::error::query_names contains an unknown query: $query_name"
              exit 1
            fi
          done
          for query_name in "${!queries[@]}"; do
            if [[ -z ${query_name_set[$query_name]+x} ]]; then
              echo "::error::queries contains a query missing from query_names: $query_name"
              exit 1
            fi
          done
          snapshot_failed=0
          validation_failures=()

          validate_prometheus_result() {
            local query_name="$1"
            local response_path="$2"

            if ! jq -e 'type == "object"' "$response_path" >/dev/null; then
              echo "::error::Prometheus response is not valid JSON: $query_name ($response_path)"
              return 1
            fi
            if ! jq -e '
              .status == "success"
              and (.data.result | type == "array")
              and ((.data.result | length) > 0)
            ' "$response_path" >/dev/null; then
              echo "::error::Prometheus query returned no series: $query_name"
              return 1
            fi
            if [[ "$query_name" == "cfs_throttling_ratio" ]] && ! jq -e --argjson minimum_samples "$minimum_cfs_samples" '
              (.data.result
                | all(.[]; ((.values | type) == "array" and (.values | length) >= $minimum_samples)))
              and all(.data.result[].values[];
                if type != "array"
                  or length < 2
                  or (.[1] | type) != "string" then
                  false
                else
                  (.[1] | test("^(0|[1-9][0-9]*)(\\.[0-9]+)?([eE][+-]?[0-9]+)?$"))
                  and ((.[1] | tonumber) >= 0)
                  and ((.[1] | tonumber) <= 1)
                end
              )
            ' "$response_path" >/dev/null; then
              echo "::error::CFS throttling ratio is not a finite value in [0,1]: $response_path"
              return 1
            fi
          }

          for metadata_path in "${metadata_files[@]}"; do
            step="$(jq -r '.step' "$metadata_path")"
            # 진단 메시지가 어느 부하 조건의 것인지 모드까지 드러내야 사후에
            # 개루프 결과를 폐루프 결과로 오독하지 않는다.
            if [[ "$(jq -r '.load_mode' "$metadata_path")" == "open" ]]; then
              step_label="rate ${step}/s"
            else
              step_label="VU ${step}"
            fi
            creation_timestamp="$(jq -er '.creation_timestamp' "$metadata_path")"
            completion_timestamp="$(jq -er '.completion_timestamp' "$metadata_path")"
            start="$(date --utc --date="$creation_timestamp - 30 seconds" +%s)"
            padded_end="$(date --utc --date="$completion_timestamp + 30 seconds" +%s)"
            current_time="$(date --utc +%s)"
            if (( padded_end > current_time )); then
              sleep "$((padded_end - current_time))"
            fi
            end="$padded_end"
            expected_sample_count=$(( (end - start) / 30 + 1 ))
            minimum_cfs_samples=$(( (expected_sample_count * 80 + 99) / 100 ))
            if (( minimum_cfs_samples < 2 )); then
              minimum_cfs_samples=2
            fi

            for query_name in "${query_names[@]}"; do
              query="${queries[$query_name]}"
              encoded_query="$(jq -rn --arg query "$query" '$query | @uri')"
              response_path="runner/raw/prometheus-${query_name}-step-${step}.json"
              request_status_path="${response_path}.request-status"
              request_stderr_path="${response_path}.request-stderr"
              request_path="${PROMETHEUS_SERVICE_PROXY}/api/v1/query_range?query=${encoded_query}&start=${start}&end=${end}&step=30"
              if ! kubectl get --raw "$request_path" > "$response_path" 2> "$request_stderr_path"; then
                printf 'request=failed\n' > "$request_status_path"
                echo "::error::Prometheus request failed: $query_name ($step_label)"
                validation_failures+=("$step_label: $query_name request failed")
                snapshot_failed=1
                continue
              fi
              printf 'request=success\n' > "$request_status_path"
              if ! validate_prometheus_result "$query_name" "$response_path"; then
                validation_failures+=("$step_label: $query_name validation failed")
                snapshot_failed=1
              fi
            done
          done

          if (( snapshot_failed )); then
            printf '%s\n' "${validation_failures[@]}" \
              > runner/raw/prometheus-validation-failures.txt
          fi
          raw_files=(runner/raw/*.json)
          raw_files+=(runner/raw/*.request-status runner/raw/*.request-stderr)
          if [[ -f runner/raw/prometheus-validation-failures.txt ]]; then
            raw_files+=(runner/raw/prometheus-validation-failures.txt)
          fi
          sha256sum "${raw_files[@]}" > runner/raw/SHA256SUMS
          if (( snapshot_failed )); then
            echo "::error::Prometheus snapshot validation failed; see runner/raw/prometheus-validation-failures.txt"
            exit 1
          fi

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-loadtest-${{ inputs.benchmark_label }}-c${{ inputs.candidate_count }}-${{ github.run_id }}
          path: runner/raw
          if-no-files-found: error
          retention-days: 14
