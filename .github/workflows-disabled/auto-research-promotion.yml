name: Auto Research promotion Draft PR

on:
  repository_dispatch:
    types: [experiment_result]
  workflow_dispatch:
    inputs:
      issue_number: {required: true, type: string}
      experiment_id: {required: true, type: string}
      candidate_sha: {required: true, type: string}
      registry_uri: {required: true, type: string}
      run_id: {required: true, type: string}
      primary_candidate: {required: true, type: string}
      primary_baseline: {required: true, type: string}
      guardrail_candidate: {required: false, type: string}
      guardrail_baseline: {required: false, type: string}
      # 마지막 승격 이후 경과일(#472). 이 workflow는 MLflow에 접근하지 않고 모든 값을
      # 호출자에게서 받으므로(다른 지표와 같은 계약), 경과일도 호출자가 구해 넘긴다.
      # 현재 산출 근거는 champion alias가 가리키는 **버전의 creation_timestamp**이며
      # alias 부여 시각이 아니다 — 근사치다(spec §6). 버전 생성은 alias 부여보다
      # 이르거나 같아 경과일이 실제보다 크게 나오고, 하드 리밋이 더 일찍 발동한다.
      days_since_last_promotion: {required: false, type: string}
      image_digest: {required: false, type: string}
      artifact_uri: {required: false, type: string}
      log_uri: {required: false, type: string}
      outcome: {required: false, type: string}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-promotion-pr:
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.client_payload.issue_number }}
      EXPERIMENT_ID: ${{ inputs.experiment_id || github.event.client_payload.experiment_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.client_payload.candidate_sha }}
      REGISTRY_URI: ${{ inputs.registry_uri || github.event.client_payload.registry_uri }}
      RUN_ID: ${{ inputs.run_id || github.event.client_payload.run_id }}
      PRIMARY_CANDIDATE: ${{ inputs.primary_candidate || github.event.client_payload.primary_candidate }}
      PRIMARY_BASELINE: ${{ inputs.primary_baseline || github.event.client_payload.primary_baseline }}
      GUARDRAIL_CANDIDATE: ${{ inputs.guardrail_candidate || github.event.client_payload.guardrail_candidate }}
      GUARDRAIL_BASELINE: ${{ inputs.guardrail_baseline || github.event.client_payload.guardrail_baseline }}
      DAYS_SINCE_LAST_PROMOTION: ${{ inputs.days_since_last_promotion || github.event.client_payload.days_since_last_promotion }}
      # 하드 리밋 정책값(#472 §8.2). "성능과 무관하게 이 일수가 지나면 교체한다".
      #
      # **비어 있으면 하드 리밋 조건을 평가하지 않는다** — 지금은 값이 확정되지 않았다.
      # `#485` 실측(2026-08-04)은 단일 origin 관측 하나뿐이고(degradation_point
      # elapsed_days=7), `safety_margin_days`가 미확정이라 리밋도 잠정이다
      # (`#485` spec §7.3, `#472` spec §8.3). 확정 전에 숫자를 박으면 근거 없는 상수가
      # 승격을 만들어낸다.
      #
      # **갱신 주체·시점**: 열화 측정을 소유한 사람이, 다중 origin 관측이 새로 쌓일
      # 때마다 재산출해 이 값을 갱신한다. 절차는
      # `docs/specs/2026-08-05-hard-retrain-limit-gate.md` §8.3과
      # `docs/guides/retraining-policy.md`("누가, 언제 갱신하는가")를 따른다.
      HARD_RETRAIN_LIMIT_DAYS: ""
      IMAGE_DIGEST: ${{ inputs.image_digest || github.event.client_payload.image_digest }}
      ARTIFACT_URI: ${{ inputs.artifact_uri || github.event.client_payload.artifact_uri }}
      LOG_URI: ${{ inputs.log_uri || github.event.client_payload.log_uri }}
      OUTCOME: ${{ inputs.outcome || github.event.client_payload.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Auto Research issue body
        id: issue
        uses: actions/github-script@v8
        env:
          ISSUE_BODY_PATH: ${{ runner.temp }}/issue.md
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              throw new Error('issue_number must be a positive integer');
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
            });
            if (!issue.labels.some((label) => label.name === 'auto-experiment')) {
              throw new Error('issue must have the auto-experiment label');
            }
            require('fs').writeFileSync(process.env.ISSUE_BODY_PATH, issue.body || '');

      - name: Validate experiment lineage
        id: lineage
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const candidateSha = process.env.CANDIDATE_SHA || '';
            const experimentId = process.env.EXPERIMENT_ID || '';
            const registryUri = process.env.REGISTRY_URI || '';
            const runId = process.env.RUN_ID || '';
            const outcome = process.env.OUTCOME || '';
            const primaryCandidate = process.env.PRIMARY_CANDIDATE || '';
            const primaryBaseline = process.env.PRIMARY_BASELINE || '';
            const guardrailCandidate = process.env.GUARDRAIL_CANDIDATE || '';
            const guardrailBaseline = process.env.GUARDRAIL_BASELINE || '';
            const daysSinceLastPromotion = process.env.DAYS_SINCE_LAST_PROMOTION || '';
            // 거부 사유를 세 갈래로 구분한다(#495 D-3).
            //   input_invalid       — 입력 형식이 계약을 벗어남
            //   comparison_rejected — 비교는 성립했으나 통과하지 못한 정상 결과
            //   lineage_invalid     — 좌표·계보가 실제로 어긋남
            class RejectionError extends Error {
              constructor(kind, message) {
                super(message);
                this.kind = kind;
              }
            }
            // 이전 동작(gate step의 float())이 받아들이던 범위를 좁히지 않는다.
            // 지수 표기(1e-05)는 producer가 작은 delta를 JSON 숫자로 실어 보낼 때
            // 흔히 나오므로 반드시 허용해야 한다. 목적은 형식을 좁히는 것이 아니라
            // NaN·Infinity·빈 값·비숫자로 gate step이 죽는 것을 막는 것이다.
            function isFiniteDecimal(value) {
              return /^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$/.test(value)
                && Number.isFinite(Number(value));
            }
            try {
              if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
                throw new RejectionError('input_invalid', 'issue_number must be a positive integer');
              }
              if (!/^[0-9a-f]{40}$/.test(candidateSha)) {
                throw new RejectionError('input_invalid', 'candidate_sha must be a 40-character lowercase SHA');
              }
              if (!/^[a-z0-9][a-z0-9-]{0,31}$/.test(experimentId)) {
                throw new RejectionError('input_invalid', 'experiment_id is invalid');
              }
              if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(runId)) {
                throw new RejectionError('input_invalid', 'run_id is invalid');
              }
              // 지표는 gate step이 float()으로 파싱한다. 여기서 걸러내지 않으면 그 step이
              // 죽고 사유가 이슈에 남지 않는다(#495 D-1).
              for (const [name, value] of [
                ['primary_candidate', primaryCandidate],
                ['primary_baseline', primaryBaseline],
              ]) {
                if (!isFiniteDecimal(value)) {
                  throw new RejectionError('input_invalid', `${name} must be a finite decimal, got "${value}"`);
                }
              }
              for (const [name, value] of [
                ['guardrail_candidate', guardrailCandidate],
                ['guardrail_baseline', guardrailBaseline],
              ]) {
                if (value !== '' && !isFiniteDecimal(value)) {
                  throw new RejectionError('input_invalid', `${name} must be a finite decimal, got "${value}"`);
                }
              }
              // 경과일은 소수가 아니라 **음이 아닌 정수**다(#472). gate step이
              // `int()`로 파싱하므로 여기서 막지 않으면 그 단계에서 죽고 사유가
              // 이슈에 남지 않는다 — 위 지표 검증과 같은 이유다(#495 D-1).
              if (daysSinceLastPromotion !== '' && !/^(?:0|[1-9][0-9]*)$/.test(daysSinceLastPromotion)) {
                throw new RejectionError(
                  'input_invalid',
                  `days_since_last_promotion must be a non-negative integer, got "${daysSinceLastPromotion}"`,
                );
              }
              // paired 비교(#454) 결과를 보낸 producer는 outcome을 함께 싣는다.
              // 통과가 아닌 결과로 승격 브랜치·PR을 만들지 않는다. outcome이 없는
              // 기존 producer는 그대로 받아들인다(하위 호환).
              if (outcome && outcome !== 'comparison_passed') {
                throw new RejectionError('comparison_rejected', `outcome must be comparison_passed, got ${outcome}`);
              }
              // registry_uri는 실험 Registry bucket의 gs:// object여야 한다. suffix만
              // 보면 https 스킴이나 남의 bucket 경로도 통과한다.
              if (!registryUri.startsWith('gs://')) {
                throw new RejectionError('input_invalid', 'registry_uri must be a gs:// URI');
              }
              // #454는 baseline/candidate를 조건별 Registry로 격리하므로 경로에
              // condition 구간이 들어간다. 조건 격리 이전 형식(#450/#461)도 계속
              // 받아들이되, candidate 조건 산출물만 승격 후보로 인정한다 —
              // baseline 경로는 어느 형식에도 해당하지 않아 거부된다.
              const isolatedRegistrySuffix =
                `/experiments/${issueNumber}/${experimentId}/candidate/${candidateSha}/registry.db`;
              const legacyRegistrySuffix =
                `/experiments/${issueNumber}/${experimentId}/${candidateSha}/registry.db`;
              if (
                !registryUri.endsWith(isolatedRegistrySuffix) &&
                !registryUri.endsWith(legacyRegistrySuffix)
              ) {
                throw new RejectionError(
                  'input_invalid',
                  `registry_uri must end with ${isolatedRegistrySuffix} or ${legacyRegistrySuffix}`,
                );
              }
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner, repo: context.repo.repo, base: candidateSha, head: 'dev',
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                throw new RejectionError('lineage_invalid', 'candidate_sha must be an ancestor of dev');
              }
              core.setOutput('valid', 'true');
              core.setOutput('reason', 'lineage_valid');
            } catch (error) {
              const kind = error.kind || 'lineage_invalid';
              core.setOutput('valid', 'false');
              core.setOutput('reason', `${kind}:${error.message}`);
              core.warning(`Experiment promotion rejected (${kind}): ${error.message}`);
            }

      - name: Evaluate structured metric gate
        id: gate
        if: steps.lineage.outputs.valid == 'true'
        env:
          ISSUE_BODY_PATH: ${{ runner.temp }}/issue.md
        shell: bash
        run: |
          python - <<'PY'
          import os
          from autoresearch.experiments.promotion_gate import evaluate, parse_criteria

          def _optional_days(name: str) -> int | None:
              """비어 있으면 None, 값이 있으면 **음이 아닌 정수**로만 받는다.

              `HARD_RETRAIN_LIMIT_DAYS`는 정책을 켜는 스위치인데 lineage step의 입력
              검증을 거치지 않는다(그건 호출자 payload만 본다). 여기서 막지 않으면
              `"30일"` 같은 오타 하나로 이 step이 ValueError로 죽고 **모든 실험**이
              `gate_step_failed`로 떨어진다. 정책을 켜는 날 처음 겪게 되는 실패라
              원인을 찾기도 어렵다.
              """
              raw = (os.environ.get(name) or "").strip()
              if not raw:
                  return None
              if not raw.isdigit():
                  raise SystemExit(
                      f"{name} must be a non-negative integer or empty, got {raw!r}"
                  )
              return int(raw)

          criteria = parse_criteria(open(os.environ["ISSUE_BODY_PATH"], encoding="utf-8").read())
          decision = evaluate(
              criteria,
              primary_candidate=float(os.environ["PRIMARY_CANDIDATE"]),
              primary_baseline=float(os.environ["PRIMARY_BASELINE"]),
              guardrail_candidate=float(os.environ["GUARDRAIL_CANDIDATE"]) if os.environ.get("GUARDRAIL_CANDIDATE") else None,
              guardrail_baseline=float(os.environ["GUARDRAIL_BASELINE"]) if os.environ.get("GUARDRAIL_BASELINE") else None,
              # 값이 없으면 None을 넘겨 하드 리밋 조건을 평가하지 않게 한다(#472 §4.2).
              # 관측되지 않은 것을 "기한이 지났다"로도 "안 지났다"로도 바꾸지 않는다.
              #
              # 호출자는 temporal hold가 걸린 측정에서는 경과일을 넘기지 않아야 한다
              # (#472 spec §3.2) — `derive_hard_retrain_limit`은 hold를 참조하지 않아
              # 오염된 곡선에서도 숫자 모양이 정상인 값을 내고, 게이트는 숫자만 받으므로
              # 스스로 구분할 수 없다.
              hard_retrain_limit_days=_optional_days("HARD_RETRAIN_LIMIT_DAYS"),
              days_since_last_promotion=_optional_days("DAYS_SINCE_LAST_PROMOTION"),
          )
          # `policy_version`을 함께 방출한다(#472 §5). 이 필드의 존재 이유가 "어떤 정책으로
          # 판정했는지가 **결과에 남아야** 승격 이력을 나중에 해석할 수 있다"인데, 여기서
          # 내보내지 않으면 GateDecision 안에만 있다가 사라져 목적을 달성하지 못한다.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"passed={'true' if decision.passed else 'false'}\n"
                  f"reason={decision.reason}\n"
                  f"policy_version={decision.policy_version}\n"
              )
          PY

      - name: Create immutable promotion branch and Draft PR
        if: steps.lineage.outputs.valid == 'true' && steps.gate.outputs.passed == 'true'
        uses: actions/github-script@v8
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_POLICY_VERSION: ${{ steps.gate.outputs.policy_version }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const candidateSha = process.env.CANDIDATE_SHA;
            const experimentId = process.env.EXPERIMENT_ID;
            const registryUri = process.env.REGISTRY_URI;
            const runId = process.env.RUN_ID;
            const branchName = `promote/${issueNumber}-${experimentId}-${candidateSha.slice(0, 12)}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/heads/promote/${issueNumber}-${experimentId}-${candidateSha.slice(0, 12)}`,
                sha: candidateSha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: existingRef } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`,
              });
              if (existingRef.object.sha !== candidateSha) {
                throw new Error(
                  `${branchName} already exists at ${existingRef.object.sha}; refusing to reuse it for ${candidateSha}`,
                );
              }
            }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', base: 'main', head: `${context.repo.owner}:${branchName}`,
            });
            // 하드 리밋으로 올라온 후보는 **지표 기준을 통과하지 못했다**(#472 §4.3).
            // 제목·본문이 그 사실을 드러내지 않으면 리뷰어가 "metric 통과 후보"라는
            // 말을 믿고 지표가 개선된 줄로 읽는다.
            const hardLimitPromotion = process.env.GATE_REASON === 'hard_retrain_limit_reached';
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo, base: 'main', head: branchName,
                title: hardLimitPromotion
                  ? `exp: #${issueNumber} ${experimentId} 하드 리밋 강제 교체 후보`
                  : `exp: #${issueNumber} ${experimentId} metric 통과 후보`,
                draft: true,
                body: [
                  `Closes #${issueNumber}`,
                  '',
                  ...(hardLimitPromotion ? [
                    '> [!WARNING]',
                    '> **지표 기준을 통과하지 못했습니다.** 마지막 승격 이후 하드 리밋',
                    '> 일수가 지나 강제 교체 후보로 올라왔습니다 — "성능이 정체돼도',
                    '> 교체한다"는 정책입니다(`#472`).',
                    '>',
                    '> 경과일은 champion 버전의 `creation_timestamp` 기준 **근사치**입니다.',
                    '> alias를 실제로 부여한 시각이 아니라 버전이 만들어진 시각이라,',
                    '> 실제 경과일보다 **크게** 나와 리밋이 더 일찍 발동할 수 있습니다.',
                    '',
                  ] : []),
                  hardLimitPromotion
                    ? `승격 게이트가 강제 교체 대상으로 판정한 dev 후보 SHA: \`${candidateSha}\``
                    : `구조화 metric gate를 통과한 dev 후보 SHA: \`${candidateSha}\``,
                  `experiment_id: \`${experimentId}\``,
                  `run_id: \`${runId}\``,
                  `registry_uri: \`${registryUri}\``,
                  `image_digest: \`${process.env.IMAGE_DIGEST || '미제공'}\``,
                  `artifact_uri: \`${process.env.ARTIFACT_URI || '미제공'}\``,
                  `log_uri: \`${process.env.LOG_URI || '미제공'}\``,
                  `사유: \`${process.env.GATE_REASON}\``,
                  `게이트 정책: \`${process.env.GATE_POLICY_VERSION || '미기록'}\``,
                ].join('\n'),
              });
            }

      # gate step이 **실패**해도 이슈에 기록이 남아야 한다(#495 C·D-1 공통). 이전 조건은
      # `steps.gate.outcome == 'success'`를 요구해, gate가 예외로 죽으면 원인과 무관하게
      # 흔적이 사라졌다 — `promotion_gate`의 label 불일치가 2일간 발견되지 않은 이유다.
      - name: Comment failed or rejected experiment result on source issue
        if: >-
          always() && steps.issue.outcome == 'success' &&
          (steps.lineage.outputs.valid != 'true' ||
          steps.gate.outcome == 'failure' ||
          steps.gate.outcome == 'cancelled' ||
          (steps.gate.outcome == 'success' && steps.gate.outputs.passed != 'true'))
        uses: actions/github-script@v8
        env:
          # 순서가 계약이다. gate는 lineage가 성공했을 때만 돌고, 그 경로에서
          # steps.lineage.outputs.reason은 항상 'lineage_valid'(truthy)다. 따라서
          # gate 실패 갈래를 lineage 사유보다 **먼저** 평가하지 않으면 gate가 죽어도
          # 사유가 'lineage_valid'로 덮여, 이 PR이 복구하려는 바로 그 관측 경로가
          # 다시 막힌다. 이 순서는 아래 테스트가 고정한다.
          GATE_REASON: >-
            ${{ steps.gate.outputs.reason
            || ((steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
            && format('gate_step_failed:{0}', steps.gate.outcome))
            || steps.lineage.outputs.reason
            || 'unknown' }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const experimentId = process.env.EXPERIMENT_ID || 'unknown';
            const candidateSha = process.env.CANDIDATE_SHA || 'unknown';
            const runId = process.env.RUN_ID || 'unknown';
            const gateReason = process.env.GATE_REASON || 'unknown';
            // 입력 형식 거부는 "실패 또는 기각"과 성격이 다르므로 제목에서 구분한다.
            const heading = gateReason.startsWith('input_invalid:')
              ? '## Auto Research 실험 결과: 입력 거부'
              : gateReason.startsWith('gate_step_failed:')
                ? '## Auto Research 실험 결과: 판정 단계 오류'
                : '## Auto Research 실험 결과: 실패 또는 기각';
            const marker = `<!-- autoresearch-result:${issueNumber}:${experimentId}:${candidateSha}:${runId} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info('An identical experiment result comment already exists');
              return;
            }
            const body = [
              heading,
              marker,
              '',
              `- experiment_id: \`${experimentId}\``,
              `- candidate_sha: \`${candidateSha}\``,
              `- run_id: \`${runId}\``,
              `- registry_uri: \`${process.env.REGISTRY_URI || '미제공'}\``,
              `- primary candidate: \`${process.env.PRIMARY_CANDIDATE || '미제공'}\``,
              `- primary baseline: \`${process.env.PRIMARY_BASELINE || '미제공'}\``,
              `- 판정 사유: \`${gateReason}\``,
              `- artifact_uri: \`${process.env.ARTIFACT_URI || '미제공'}\``,
              `- log_uri: \`${process.env.LOG_URI || '미제공'}\``,
              '',
              'main 승격 PR은 생성하지 않았습니다.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
      # gate가 skip되면 `steps.gate.outputs.reason`이 비어 summary가 빈 값만 남았다
      # (#495 D-3). lineage 사유로 대체해 어떤 경로로 끝났는지 항상 드러나게 한다.
      - name: Write result summary
        if: always()
        env:
          # 실패 코멘트와 동일한 순서를 쓴다 — 이유는 그쪽 주석 참조.
          GATE_REASON: >-
            ${{ steps.gate.outputs.reason
            || ((steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
            && format('gate_step_failed:{0}', steps.gate.outcome))
            || steps.lineage.outputs.reason
            || 'unknown' }}
        run: 'echo "experiment promotion gate: ${GATE_REASON}" >> "$GITHUB_STEP_SUMMARY"'
