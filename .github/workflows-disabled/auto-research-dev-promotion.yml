name: Auto Research dev promotion

on:
  repository_dispatch:
    types: [auto-research-experiment-completed]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      experiment_id:
        required: true
        type: string
      candidates_json:
        required: true
        type: string

jobs:
  validate-coordinate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      issue_number: ${{ steps.validate.outputs.issue_number }}
      experiment_id: ${{ steps.validate.outputs.experiment_id }}
    steps:
      - id: validate
        name: Validate promotion coordinate
        uses: actions/github-script@v8
        with:
          script: |
            const payload = context.payload;
            const isDispatch = payload.action === 'auto-research-experiment-completed';
            const rawIssueNumber = isDispatch
              ? payload.client_payload?.issue_number
              : payload.inputs?.issue_number;
            const rawExperimentId = isDispatch
              ? payload.client_payload?.experiment_id
              : payload.inputs?.experiment_id;

            function failClosed(message) {
              core.setFailed(message);
              throw new Error(message);
            }

            if (typeof rawIssueNumber !== 'string' || !/^[1-9][0-9]*$/.test(rawIssueNumber)) {
              failClosed('issue_number must be a canonical positive decimal string');
            }
            if (
              typeof rawExperimentId !== 'string' ||
              !/^[a-z0-9][a-z0-9-]{0,31}$/.test(rawExperimentId)
            ) {
              failClosed('experiment_id must use the lowercase safe identifier syntax');
            }

            core.setOutput('issue_number', rawIssueNumber);
            core.setOutput('experiment_id', rawExperimentId);

  promote-completed-experiment:
    runs-on: ubuntu-latest
    needs: validate-coordinate
    permissions:
      contents: write
      issues: write
    concurrency:
      group: auto-research-dev-promotion
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout trusted selector
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate complete result set and promote one candidate
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.validate-coordinate.outputs.issue_number }}
          EXPERIMENT_ID: ${{ needs.validate-coordinate.outputs.experiment_id }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const issueBranchMarker = '<!-- auto-research-issue-branch:v1 -->';
            const resultMarkerPrefix = '<!-- auto-research-experiment-result:';
            const resultMarker = '<!-- auto-research-experiment-result:v2 -->';
            const _MAX_COMPLETION_CANDIDATES = 50;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const payload = context.payload;
            const isDispatch = payload.action === 'auto-research-experiment-completed';
            const issueNumberText = process.env.ISSUE_NUMBER;
            const experimentId = process.env.EXPERIMENT_ID;
            const candidatesJson = isDispatch
              ? JSON.stringify(payload.client_payload?.candidates)
              : payload.inputs?.candidates_json;

            function failClosed(message) {
              core.setFailed(message);
              throw new Error(message);
            }

            function requireMatch(value, expression, name) {
              if (typeof value !== 'string' || !expression.test(value)) {
                failClosed(`invalid ${name}`);
              }
              return value;
            }

            function parseIssueBranchMarker(body) {
              const match = body.match(
                /^<!-- auto-research-issue-branch:v1 -->\n## Auto Research issue branch\n- source_issue: #(\d+)\n- issue_branch: `([^`]+)`\n- base_dev_sha: `([0-9a-f]{40})`\n- criteria_id: `([0-9a-f]{64})`\n- reproducibility_id: `([0-9a-f]{64})`$/,
              );
              if (match === null) {
                failClosed('issue branch marker is malformed');
              }
              return {
                sourceIssue: Number(match[1]),
                issueBranch: match[2],
                baseDevSha: match[3],
                criteriaId: match[4],
                reproducibilityId: match[5],
              };
            }

            function parseResultMarker(body) {
              const match = body.match(
                /^<!-- auto-research-experiment-result:v2 -->\n## Auto Research experiment result\n- source_issue: #(\d+)\n- experiment_id: `([^`]+)`\n- result_set_id: `([0-9a-f]{64})`\n- selection_reason: `(qualified_candidate|no_qualified_candidate)`\n- selected_candidate_sha: `(none|[0-9a-f]{40})`\n- state: `(pending|merged|no_qualified|merge_conflict|merge_api_failed)`$/,
              );
              if (match === null) {
                failClosed('experiment result marker is malformed');
              }
              const result = {
                sourceIssue: Number(match[1]),
                experimentId: match[2],
                resultSetId: match[3],
                selectionReason: match[4],
                selectedCandidateSha: match[5] === 'none' ? '' : match[5],
                state: match[6],
              };
              const requiresCandidate = result.state !== 'no_qualified';
              if (
                (requiresCandidate && (
                  result.selectionReason !== 'qualified_candidate' || result.selectedCandidateSha === ''
                )) ||
                (!requiresCandidate && (
                  result.selectionReason !== 'no_qualified_candidate' || result.selectedCandidateSha !== ''
                ))
              ) {
                failClosed('experiment result marker state is inconsistent');
              }
              return result;
            }

            function resultMarkerBody(resultSetId, selectionReason, selectedCandidateSha, state) {
              return [
                resultMarker,
                '## Auto Research experiment result',
                `- source_issue: #${issueNumber}`,
                `- experiment_id: \`${experimentId}\``,
                `- result_set_id: \`${resultSetId}\``,
                `- selection_reason: \`${selectionReason}\``,
                `- selected_candidate_sha: \`${selectedCandidateSha || 'none'}\``,
                `- state: \`${state}\``,
              ].join('\n');
            }

            if (typeof issueNumberText !== 'string' || !/^[1-9][0-9]*$/.test(issueNumberText)) {
              failClosed('validated issue number is malformed');
            }
            const issueNumber = Number(issueNumberText);
            if (!Number.isSafeInteger(issueNumber)) {
              failClosed('validated issue number is outside the safe integer range');
            }
            requireMatch(experimentId, /^[a-z0-9][a-z0-9-]{0,31}$/, 'experiment_id');
            let candidates;
            try {
              candidates = JSON.parse(candidatesJson);
            } catch (error) {
              failClosed('candidates_json must be valid JSON');
            }
            if (!Array.isArray(candidates) || candidates.length === 0 || candidates.length > _MAX_COMPLETION_CANDIDATES) {
              failClosed(`candidates_json must contain between 1 and ${_MAX_COMPLETION_CANDIDATES} candidates`);
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            if (typeof issue.data.title !== 'string' || typeof issue.data.body !== 'string') {
              failClosed('source issue must have a title and Issue Form body');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const issueBranchMarkers = comments.filter((comment) =>
              typeof comment.body === 'string' && comment.body.includes(issueBranchMarker),
            );
            if (issueBranchMarkers.length !== 1) {
              failClosed('exactly one issue branch marker comment is required');
            }
            const issueBranchComment = issueBranchMarkers[0];
            if (issueBranchComment.user.login !== 'github-actions[bot]') {
              failClosed('issue branch marker was not created by github-actions[bot]');
            }
            const recorded = parseIssueBranchMarker(issueBranchComment.body);
            if (recorded.sourceIssue !== issueNumber) {
              failClosed('issue branch marker source issue does not match event');
            }

            const verifiedCandidateShas = new Set();
            for (const candidate of candidates) {
              if (candidate === null || typeof candidate !== 'object' || Array.isArray(candidate)) {
                failClosed('candidate must be an object before lineage verification');
              }
              requireMatch(candidate.candidate_sha, /^[0-9a-f]{40}$/, 'candidate SHA');
              const baselineComparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: recorded.baseDevSha,
                head: candidate.candidate_sha,
              });
              if (!['ahead', 'identical'].includes(baselineComparison.data.status)) {
                failClosed('candidate is not descended from recorded base_dev_sha');
              }
              const branchComparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: candidate.candidate_sha,
                head: recorded.issueBranch,
              });
              if (!['ahead', 'identical'].includes(branchComparison.data.status)) {
                failClosed('candidate is not an ancestor of the recorded issue branch');
              }
              verifiedCandidateShas.add(candidate.candidate_sha);
            }

            const bodyPath = path.join(os.tmpdir(), `auto-research-issue-${issueNumber}.md`);
            fs.writeFileSync(bodyPath, issue.data.body, 'utf8');
            const selectorEnvironment = {
              PATH: process.env.PATH,
              LANG: process.env.LANG || 'C.UTF-8',
              PYTHONUTF8: '1',
              GITHUB_OUTPUT: '',
            };
            let selectorOutput;
            try {
              selectorOutput = execFileSync(
                'python',
                [
                  'tools/auto_research_issue_branch.py',
                  '--issue-number', String(issueNumber),
                  '--issue-title', issue.data.title,
                  '--issue-body-file', bodyPath,
                  '--experiment-id', experimentId,
                  '--base-dev-sha', recorded.baseDevSha,
                  '--candidates-json', candidatesJson,
                ],
                { encoding: 'utf8', env: selectorEnvironment },
              );
            } catch (error) {
              failClosed(`completion selector rejected result set: ${error.message}`);
            } finally {
              fs.rmSync(bodyPath, { force: true });
            }
            const selector = Object.fromEntries(
              selectorOutput.trim().split('\n').map((line) => line.split(/=(.*)/s, 2)),
            );
            if (
              selector.criteria_id !== recorded.criteriaId ||
              selector.reproducibility_id !== recorded.reproducibilityId
            ) {
              failClosed('source Issue Form criteria or reproducibility ID changed after branch creation');
            }
            requireMatch(selector.result_set_id, /^[0-9a-f]{64}$/, 'result_set_id');
            if (!['qualified_candidate', 'no_qualified_candidate'].includes(selector.selection_reason)) {
              failClosed('selector returned an invalid selection reason');
            }
            const selectedCandidateSha = selector.selected_candidate_sha || '';
            if (selector.selection_reason === 'qualified_candidate') {
              requireMatch(selectedCandidateSha, /^[0-9a-f]{40}$/, 'selected candidate SHA');
              if (!verifiedCandidateShas.has(selectedCandidateSha)) {
                failClosed('selector chose a candidate that did not pass lineage verification');
              }
            } else if (selectedCandidateSha !== '') {
              failClosed('unqualified selector result must not name a candidate');
            }

            const markerComments = comments.filter((comment) =>
              typeof comment.body === 'string' && comment.body.includes(resultMarkerPrefix),
            );
            const parsedResultMarkers = markerComments.map((comment) => {
              if (comment.user.login !== 'github-actions[bot]') {
                failClosed('experiment result marker was not created by github-actions[bot]');
              }
              const recordedResult = parseResultMarker(comment.body);
              if (recordedResult.sourceIssue !== issueNumber) {
                failClosed('experiment result marker source issue does not match event');
              }
              return { commentId: comment.id, recordedResult };
            });
            const matchingResultMarkers = parsedResultMarkers.filter(
              ({ recordedResult }) => recordedResult.experimentId === experimentId,
            );
            if (matchingResultMarkers.length > 1) {
              failClosed('multiple experiment result marker comments found');
            }
            if (matchingResultMarkers.length === 1) {
              const recordedResult = matchingResultMarkers[0].recordedResult;
              if (
                recordedResult.resultSetId !== selector.result_set_id ||
                recordedResult.selectionReason !== selector.selection_reason ||
                recordedResult.selectedCandidateSha !== selectedCandidateSha
              ) {
                failClosed('experiment result marker rejects a changed result set');
              }
              if (recordedResult.state !== 'pending') {
                if (['merge_conflict', 'merge_api_failed'].includes(recordedResult.state)) {
                  failClosed(`previous promotion ended with ${recordedResult.state}`);
                }
                return;
              }
              const pendingCommentId = matchingResultMarkers[0].commentId;
              const reconciliation = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: selectedCandidateSha,
                head: 'dev',
              });
              if (['ahead', 'identical'].includes(reconciliation.data.status)) {
                await updateResultMarker(pendingCommentId, 'merged');
                return;
              }
              await mergePendingCandidate(pendingCommentId);
              return;
            }

            if (selector.selection_reason === 'no_qualified_candidate') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: resultMarkerBody(selector.result_set_id, selector.selection_reason, '', 'no_qualified'),
              });
              return;
            }

            const pendingComment = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: resultMarkerBody(selector.result_set_id, selector.selection_reason, selectedCandidateSha, 'pending'),
            });
            const pendingCommentId = pendingComment.data.id;
            await mergePendingCandidate(pendingCommentId);

            async function mergePendingCandidate(pendingCommentId) {
              let mergeResponse;
              try {
                mergeResponse = await github.rest.repos.merge({
                  owner,
                  repo,
                  base: 'dev',
                  head: selectedCandidateSha,
                });
              } catch (error) {
                const finalState = error.status === 409 ? 'merge_conflict' : 'merge_api_failed';
                await updateResultMarker(pendingCommentId, finalState);
                failClosed(`dev merge ended with ${finalState}`);
              }

              if (mergeResponse.status === 201) {
                requireMatch(mergeResponse.data.sha, /^[0-9a-f]{40}$/, 'merge SHA');
              }
              const finalState = (
                mergeResponse.status === 201 || mergeResponse.status === 204
              )
                ? 'merged'
                : 'merge_api_failed';
              await updateResultMarker(pendingCommentId, finalState);
              if (finalState !== 'merged') {
                failClosed(`dev merge ended with ${finalState}`);
              }
            }

            async function updateResultMarker(pendingCommentId, state) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: pendingCommentId,
                body: resultMarkerBody(selector.result_set_id, selector.selection_reason, selectedCandidateSha, state),
              });
            }
