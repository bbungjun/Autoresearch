name: feast-apply

# #561(구 #346) — apply는 셀프 호스티드 러너(feast-apply-dev/feast-apply-prod,
# infra#541/#557/#558)에서 직접 실행된다. 이 러너는 VPC 안에서 돌아 private
# Redis(PSC)에 닿으므로 `full_scan_for_deletion: true`가 요구하는 online store
# 삭제 스캔을 러너 위에서 바로 수행할 수 있다. main은 prod, dev는 dev registry를
# 반영하며, 소유 경계("registry apply는 GHA, materialize는 Airflow")는 그대로다.
# GKE Job으로 apply를 우회하던 옛 경로(deployment/feast/apply-job.yaml,
# deployment/Dockerfile.feast)는 롤백 여유로 저장소에 남아 있으나 이 워크플로우는 더 이상
# 그 경로를 쓰지 않는다.

on:
  push:
    branches: [main, dev]
    paths:
      - feature_repo/feature_definitions.py
      - feature_repo/feature_store.yaml
      - feature_repo/.feastignore
      - feature_repo/redis_iam.py
      - feature_repo/bootstrap.py
      - feature_repo/env.py
      - scripts/fetch_redis_ca.py
      # apply 후 검증 스크립트. 이게 빠져 있으면 게이트만 고친 커밋이 다음 정의 변경
      # 전까지 한 번도 실행되지 않는다.
      - scripts/verify_registry_portability.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/feast-apply.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "apply 대상 환경 (prod|dev, #399). push는 브랜치(main/dev)와 같은 환경."
        type: choice
        default: prod
        options:
          - prod
          - dev

permissions:
  contents: read

concurrency:
  group: feast-apply
  cancel-in-progress: false

jobs:
  feast-apply:
    name: Apply Feast feature definitions to registry
    # 브랜치 이름이 아니라 **환경 이름**을 고른다(#548). GitHub Environment 이름은
    # infra#424가 정한 prod/dev이고, main이라는 Environment는 비어 있다. 여기에
    # github.ref_name을 그대로 넣으면 잡이 빈 Environment로 떠서 WIF provider·SA가
    # 저장소 수준 폴백으로 떨어지고, OIDC의 environment 클레임도 main이 되어
    # attribute.environment/prod principalSet에 걸리지 않는다. 인증 스텝은 자격
    # 파일만 쓰고 통과하므로 이 실패는 첫 gcloud 호출에서야 드러난다.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    # runs-on은 env 컨텍스트를 읽지 못해(잡 시작 전에 평가) 같은 식을 여기 한 번 더
    # 적는다. 스케일셋 이름은 인프라 저장소
    # (아래는 인프라 저장소 트리 기준 경로다 — #754 재배치와 무관하다)
    # deploy/actions-runner-scale-set-feast-{dev,prod}/values.yaml의
    # runnerScaleSetName과 정확히 일치해야 한다(#561). ARC는 runs-on에 스케일셋
    # 이름을 그대로 쓴다 — 배열 문법이 아니다.
    runs-on: feast-apply-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write

    env:
      # prod/dev 환경 분리(#399). push는 main→prod/dev→dev로 고정하고 수동
      # dispatch만 입력값을 선택한다. `environment:` 키는 env 컨텍스트를 읽지 못해
      # 같은 식을 두 번 쓸 수밖에 없으므로, 두 값이 어긋나지 않도록
      # tests/test_feast_apply_workflow.py가 동일 문자열임을 고정한다.
      AUTORESEARCH_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: dev 환경 좌표 확인
        uses: ./.github/actions/resolve-dev-environment
        with:
          configured_project_id: ${{ vars.GCP_PROJECT_ID }}
          configured_region: ${{ vars.GCP_REGION }}

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.FEAST_APPLY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate required configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          GCS_STAGING_LOCATION: ${{ vars.GCS_STAGING_LOCATION }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_CA_SECRET_ID: ${{ vars.REDIS_CA_SECRET_ID }}
          WIF_PROVIDER_ID: ${{ vars.WIF_PROVIDER_ID }}
        shell: bash
        run: |
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION BQ_DATASET GCS_REGISTRY_PATH \
            GCS_STAGING_LOCATION REDIS_HOST REDIS_PORT REDIS_CA_SECRET_ID \
            WIF_PROVIDER_ID
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured"
              exit 1
            fi
          done
          # #548: 좌표가 비어 있는 것보다 **환경과 어긋난 것**이 위험하다. 잡이 엉뚱한
          # Environment 로 뜨면 값이 채워진 채로 저장소 수준 폴백(providers/github)이
          # 오고, 인증 스텝은 통과한 뒤 한참 뒤에야 실패한다. WIF provider 이름은
          # infra#424 가 환경별로 고정했으므로(github-feast-prod|dev) 여기서 대조한다.
          expected_provider_suffix="/providers/github-feast-${AUTORESEARCH_ENV}"
          if [[ "$WIF_PROVIDER_ID" != *"$expected_provider_suffix" ]]; then
            echo "::error::WIF_PROVIDER_ID does not match the ${AUTORESEARCH_ENV} environment (expected it to end with ${expected_provider_suffix})"
            echo "::error::the job most likely started in a GitHub Environment that has no feast-apply coordinates"
            exit 1
          fi

      - name: Verify the environment credentials
        # #548 의 실패는 "apply 결과가 없다"가 아니라 "가장에 실패했다"였다. 자격
        # 확인은 apply 를 실제로 돌리기 전에 구조적으로 끝낸다. 토큰은 절대
        # 로그로 흘리지 않는다.
        shell: bash
        run: |
          if ! auth_error="$(gcloud auth print-access-token 2>&1 >/dev/null)"; then
            echo "$auth_error"
            echo "::error::failed to obtain credentials for this environment — check WIF_PROVIDER_ID and FEAST_APPLY_SA of the ${AUTORESEARCH_ENV} GitHub Environment"
            exit 1
          fi
          echo "credentials ready for the ${AUTORESEARCH_ENV} environment"

      - name: Record registry generation before apply
        id: before
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
        shell: bash
        run: |
          generation="$(gcloud storage objects describe "$GCS_REGISTRY_PATH" \
            --format='value(generation)' 2>/dev/null || true)"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true

      - name: Install feast dependency group
        # feast 그룹은 dev 그룹과 충돌하므로 --no-dev 로 격리 설치한다(ci.yml과 동일).
        # 아래 apply 스텝과 뒤쪽 registry 검증 스텝이 이 설치를 함께 재사용한다.
        run: uv sync --frozen --no-dev --group feast

      - name: Fetch Redis CA and run feast apply
        # deployment/feast/apply-job.yaml이 GKE Job 컨테이너 안에서 하던 일(CA 조달 →
        # feature_repo로 이동 → feast apply)을 러너 위에서 그대로 실행한다. 환경
        # 변수 이름은 feature_store.yaml의 ${VAR} 치환이 그대로 읽도록 옛 Job의
        # env 이름과 완전히 동일하게 맞춘다(#561).
        env:
          # feature_store.yaml의 online_store.type이
          # feature_repo.redis_iam.IAMRedisOnlineStore라 체크아웃 루트가 import
          # 경로에 있어야 한다.
          PYTHONPATH: ${{ github.workspace }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # feast GCS registry의 storage.Client()가 프로젝트를 추론하도록 명시.
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          GCS_STAGING_LOCATION: ${{ vars.GCS_STAGING_LOCATION }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_CA_SECRET_ID: ${{ vars.REDIS_CA_SECRET_ID }}
          # 위 fetch_redis_ca.py가 쓰는 경로와 같아야 한다.
          REDIS_TLS_CA_PATH: /tmp/redis-ca.pem
        shell: bash
        run: |
          # prod/dev 환경 분리(#399). bare `feast apply`는 bootstrap.py를 거치지
          # 않으므로 feature_store.yaml의 ${FEAST_ONLINE_FULL_SCAN_FOR_DELETION}
          # 치환을 위해 이 스텝이 값을 직접 주입한다. feature_repo/env.py 의 파생
          # 규칙(prod=true, dev=false)을 그대로 재현한다. dev=false 면 apply 가
          # Redis 에 접속하지 않아 dev registry apply 가 prod Redis 를 건드리지
          # 않는다.
          if [[ "$AUTORESEARCH_ENV" == "dev" ]]; then
            FEAST_ONLINE_FULL_SCAN_FOR_DELETION="false"
          else
            FEAST_ONLINE_FULL_SCAN_FOR_DELETION="true"
          fi
          export FEAST_ONLINE_FULL_SCAN_FOR_DELETION
          # feast 공식 CLI에는 TLS CA 조달 훅이 없어 apply 직전에 내려받는다.
          # google-cloud-secret-manager 는 uv 프로젝트 의존성이라 러너의 system
          # python 에는 없다 — bare python 이면 ModuleNotFoundError.
          # dev는 FEAST_ONLINE_FULL_SCAN_FOR_DELETION=false라 Redis에 접속하지
          # 않으므로 CA도 필요 없다. feast_apply_dev GSA는 redis_server_ca
          # 시크릿 접근권이 없는 게 의도된 보안 경계(infra #424)라 무조건
          # 조달하면 403이 난다(#575).
          if [[ "$AUTORESEARCH_ENV" != "dev" ]]; then
            uv run --no-sync python scripts/fetch_redis_ca.py "$REDIS_TLS_CA_PATH"
          fi
          # ── #754 전환용 일회성 shim ─────────────────────────────────────────
          # `feast apply`는 새 정의를 쓰기 전에 **기존 레지스트리를 읽어** diff를 낸다.
          # 그 레지스트리의 ODFV는 UDF 본체가 아니라 이름을 dill by-reference로 물고
          # 있고(#409), 그 이름이 #754 이전 경로인 `src.features.feature_builder`다.
          # 재배치로 그 모듈이 사라져 역직렬화가 ModuleNotFoundError로 죽는다 —
          # **레지스트리를 고치려면 먼저 읽어야 하는데 읽는 것 자체가 실패하는 교착**이다.
          #
          # 옛 이름으로 import되는 전달 모듈을 러너의 임시 경로에만 만들어 그 한 번을
          # 통과시킨다. apply가 성공하면 레지스트리가 새 이름으로 재직렬화되므로 이
          # 블록과 아래 PYTHONPATH 확장은 **그 다음 PR에서 제거한다.**
          #
          # 저장소 트리에 `src/`를 되살리지 않는다 — lint.yml의 부활 방지 가드가 살아
          # 있어야 하고, 임시 조각이 영구 구조물이 되는 것이 이 방식의 전형적 실패다.
          shim_root="$(mktemp -d)"
          mkdir -p "$shim_root/src/features"
          : > "$shim_root/src/__init__.py"
          : > "$shim_root/src/features/__init__.py"
          cat > "$shim_root/src/features/feature_builder.py" <<'SHIM'
          from autoresearch.feature_engineering.feature_builder import (  # noqa: F401
              compute_category_matches,
          )
          SHIM
          export PYTHONPATH="${PYTHONPATH}:${shim_root}"
          echo "transition shim: ${shim_root}"
          # ────────────────────────────────────────────────────────────────────

          cd feature_repo
          # --log-level debug가 없으면 기본값 warning이라 삭제 건수 로그
          # (feast redis.py의 logger.debug)가 남지 않아 삭제 경로를 검증할 수 없다.
          uv run --no-sync feast --log-level debug apply 2>&1 | tee ../apply.log

      - name: Guard against silent apply failure (log pattern)
        # feast 0.64 CLI는 FeastProviderLoginError를 삼키고 exit 0으로 끝난다.
        # 위 스텝이 성공으로 끝나도 이 패턴이 있으면 apply가 실제로는 실패한 것이다.
        shell: bash
        run: |
          if grep -E 'application-default login|GCP error:' apply.log; then
            echo "::error::feast apply failed silently (FeastProviderLoginError swallowed with exit 0)"
            exit 1
          fi

      - name: Guard against silent apply failure (registry generation)
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          BEFORE_GENERATION: ${{ steps.before.outputs.generation }}
        shell: bash
        run: |
          after_generation="$(gcloud storage objects describe "$GCS_REGISTRY_PATH" \
            --format='value(generation)' 2>/dev/null || true)"
          if [[ -n "$BEFORE_GENERATION" && "$after_generation" == "$BEFORE_GENERATION" ]]; then
            echo "::error::registry generation unchanged after apply (silent failure)"
            exit 1
          fi

      # 위 두 가드는 "apply가 돌았는가"만 본다. 아래는 "의도한 내용이 들어갔는가"를 본다 —
      # #409에서 apply가 성공하고 generation도 바뀌었는데(meta만 갱신) ODFV의 dill body는
      # 그대로여서 학습이 계속 깨진 사례가 실제로 있었다. feast의 변경 감지가
      # (udf_string, 바이트코드)만 보기 때문에 헬퍼의 소속 모듈 변경을 놓친 것이라,
      # 정의 파일 쪽 가드로는 못 막고 **결과물을 읽어봐야만** 드러난다.
      - name: Verify the applied registry loads in the consumer import path
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          BEFORE_GENERATION: ${{ steps.before.outputs.generation }}
        shell: bash
        run: |
          gcloud storage cp "$GCS_REGISTRY_PATH" applied-registry.db
          if uv run --no-sync python scripts/verify_registry_portability.py applied-registry.db; then
            exit 0
          fi
          # 이 스텝은 apply가 prod 레지스트리를 이미 덮어쓴 뒤에 돈다. 여기서 닫히는 것은
          # 배포가 아니라 "성공했다는 신호"이므로, 운영자가 바로 되돌릴 수 있게 명령을 남긴다.
          # 레지스트리 버킷은 object versioning이 켜져 있어 apply 직전 generation으로 복구된다.
          echo "prod 레지스트리는 이미 덮어써진 상태다 — 학습·materialize는 지금 이 레지스트리를 읽는다."
          if [[ -n "$BEFORE_GENERATION" ]]; then
            echo "롤백: gcloud storage cp \"${GCS_REGISTRY_PATH}#${BEFORE_GENERATION}\" \"${GCS_REGISTRY_PATH}\""
          else
            echo "롤백: gcloud storage ls -a \"$GCS_REGISTRY_PATH\" 로 apply 직전 generation을 찾아 같은 방식으로 복사"
          fi
          echo "재적용: 정의를 고쳤는데도 갱신이 안 되면 UDF의 udf_string(소스 텍스트)이나 바이트코드를 바꿔야 한다 (#409)"
          echo "::error::applied registry is not loadable by training/serving — roll back to generation ${BEFORE_GENERATION:-unknown}, then fix and re-apply (see log above)"
          exit 1
