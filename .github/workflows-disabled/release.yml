        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.publish-application-image.outputs.source_sha }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full commit SHA"
            exit 1
          fi
          if [[ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Experiment executor checkout does not match the application source SHA"
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          WIF_PROVIDER_ID: ${{ vars.WIF_PROVIDER_ID }}
          GAR_PUSHER_SA: ${{ secrets.GAR_PUSHER_SA }}
        shell: bash
        run: |
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY \
            WIF_PROVIDER_ID GAR_PUSHER_SA
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured"
              exit 1
            fi
          done

      - name: Resolve executor image references
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          RELEASE_IMAGE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source SHA must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ -n "$RELEASE_IMAGE_TAG" ]] \
            && [[ ! "$RELEASE_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release tag is not a valid Docker tag"
            exit 1
          fi

          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/autoresearch-agent-orchestration-executor"
          sha_ref="${image_uri}:sha-${SOURCE_SHA}"

          {
            echo "tags<<EOF"
            echo "$sha_ref"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "${image_uri}:${RELEASE_IMAGE_TAG}"
            fi
            echo "EOF"
            echo "uri=$image_uri"
            echo "sha_ref=$sha_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GAR_PUSHER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push experiment executor image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/executor.Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify executor digest, metadata, and import contract
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Experiment executor build did not return a valid registry digest"
            exit 1
          fi

          digest_ref="${IMAGE_URI}@${DIGEST}"
          docker pull "$digest_ref"

          image_revision="$(docker image inspect "$digest_ref" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$SOURCE_SHA" ]]; then
            echo "::error::Experiment executor OCI revision does not match checked out source SHA"
            exit 1
          fi

          image_user="$(docker image inspect "$digest_ref" --format '{{ .Config.User }}')"
          if [[ -z "$image_user" || "$image_user" == "0" || "$image_user" == "root" ]]; then
            echo "::error::Experiment executor image must run as a non-root user"
            exit 1
          fi

          docker run --rm --read-only "$digest_ref" sh -ec '
            git --version
            uv --version
            node --version
            codex --version
            python -c "import applications.experiment_platform.executor.main, applications.experiment_platform.executor.token_minter, applications.experiment_platform.executor.workspace, applications.experiment_platform.executor.codex_worker, applications.experiment_platform.executor.verifier, applications.experiment_platform.executor.finalizer, applications.experiment_platform.executor.phase2"
          '

          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"

      - name: Write executor release summary
        env:
          DIGEST_REF: ${{ steps.verify.outputs.digest_ref }}
          RELEASE_IMAGE_TAG: ${{ github.event.release.tag_name }}
          SHA_REF: ${{ steps.image.outputs.sha_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## Experiment executor image"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Immutable tag: \`$SHA_REF\`"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "- Release tag: \`$RELEASE_IMAGE_TAG\`"
            fi
            echo "- Executor digest_ref: \`$DIGEST_REF\`"
            echo
            echo "This immutable digest is the handoff for the infra branch-bootstrap Job."
          } >> "$GITHUB_STEP_SUMMARY"

  promote-airflow-digest:
    name: Open Airflow digest promotion PR
    needs: publish-application-image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create installation token for the Airflow repository
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Autoresearch-airflow

      - name: Checkout Airflow deployment repository
        uses: actions/checkout@v6
        with:
          repository: SKYAHO/Autoresearch-airflow
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: airflow-repo

      - name: Update the immutable application digest
        env:
          DIGEST_REF: ${{ needs.publish-application-image.outputs.digest_ref }}
          SOURCE_SHA: ${{ needs.publish-application-image.outputs.source_sha }}
        shell: bash
        run: |
          python airflow-repo/scripts/promote_batch_image.py \
            --values airflow-repo/deploy/airflow/values.yaml \
            --digest-ref "$DIGEST_REF" \
            --source-sha "$SOURCE_SHA"

      - name: Resolve promotion branch
        id: promotion-branch
        env:
          SOURCE_SHA: ${{ needs.publish-application-image.outputs.source_sha }}
        shell: bash
        run: echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Create Airflow promotion pull request
        id: promotion-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: airflow-repo
          # Autoresearch-airflow 트리 기준 경로다 — 이 저장소의 #754 재배치와 무관하다.
          add-paths: deploy/airflow/values.yaml
          base: main
          branch: automation/batch-${{ steps.promotion-branch.outputs.short_sha }}
          delete-branch: true
          commit-message: "chore: batch image digest 승격"
          title: "chore: batch image digest 승격 (${{ steps.promotion-branch.outputs.short_sha }})"
          body: |
            Autoresearch application release가 검증한 immutable image를 dev Airflow 배포 후보로 승격합니다.

            - Source SHA: `${{ needs.publish-application-image.outputs.source_sha }}`
            - Digest: `${{ needs.publish-application-image.outputs.digest_ref }}`
            - Release workflow: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            이 PR의 CI가 통과한 뒤 사람이 merge하면 Airflow 저장소의 GKE 배포 workflow가 실행됩니다.

      - name: Write promotion summary
        env:
          PULL_REQUEST_URL: ${{ steps.promotion-pr.outputs.pull-request-url }}
          SOURCE_SHA: ${{ needs.publish-application-image.outputs.source_sha }}
          DIGEST_REF: ${{ needs.publish-application-image.outputs.digest_ref }}
        shell: bash
        run: |
          {
            echo "## Airflow digest promotion"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Digest: \`$DIGEST_REF\`"
            if [[ -n "$PULL_REQUEST_URL" ]]; then
              echo "- Pull request: $PULL_REQUEST_URL"
            else
              echo "- Pull request: no change (the digest is already current)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-training-image:
    name: Build, push, and verify training image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest_ref: ${{ steps.verify.outputs.digest_ref }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve immutable source ref
        id: source-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$MANUAL_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::source_sha must be a full 40-character commit SHA"
              exit 1
            fi
            source_ref="${MANUAL_SOURCE_SHA,,}"
            release_image_tag=""
          else
            if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Release tag is not a valid Docker tag"
              exit 1
            fi
            source_ref="$RELEASE_TAG"
            release_image_tag="$RELEASE_TAG"
          fi

          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_image_tag=$release_image_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source-ref.outputs.ref }}
          fetch-depth: 1

      - name: Record checked out source SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full commit SHA"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            && [[ "$source_sha" != "${MANUAL_SOURCE_SHA,,}" ]]; then
            echo "::error::Checked out SHA does not match source_sha"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::Release source SHA must be an ancestor of origin/main"
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          WIF_PROVIDER_ID: ${{ vars.WIF_PROVIDER_ID }}
          GAR_PUSHER_SA: ${{ secrets.GAR_PUSHER_SA }}
        shell: bash
        run: |
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY \
            WIF_PROVIDER_ID GAR_PUSHER_SA
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured"
              exit 1
            fi
          done

      - name: Resolve image references
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          RELEASE_IMAGE_TAG: ${{ steps.source-ref.outputs.release_image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/autoresearch-training"
          sha_ref="${image_uri}:sha-${SOURCE_SHA}"

          {
            echo "tags<<EOF"
            echo "$sha_ref"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "${image_uri}:${RELEASE_IMAGE_TAG}"
            fi
            echo "EOF"
            echo "uri=$image_uri"
            echo "sha_ref=$sha_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GAR_PUSHER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push training image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.train
          push: true
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify digest, metadata, and runtime dependencies
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid registry digest"
            exit 1
          fi

          digest_ref="${IMAGE_URI}@${DIGEST}"
          docker pull "$digest_ref"

          image_revision="$(docker image inspect "$digest_ref" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$SOURCE_SHA" ]]; then
            echo "::error::OCI revision does not match checked out source SHA"
            exit 1
          fi

          image_user="$(docker image inspect "$digest_ref" --format '{{ .Config.User }}')"
          if [[ -z "$image_user" || "$image_user" == "0" || "$image_user" == "root" ]]; then
            echo "::error::Training image must run as a non-root user"
            exit 1
          fi

          # 코드는 이미지에 없고 ENTRYPOINT가 GCS 부트스트랩이므로, 엔트리포인트를 우회해
          # baked venv의 런타임 의존성만 검증한다. onnxmltools/onnxruntime 누락(#336 이후
          # stale 이미지로 ONNX 변환이 조용히 실패한 사고)을 릴리스 시점에 잡는 지점이다.
          docker run --rm --entrypoint python "$digest_ref" \
            -c "import onnxmltools, onnxruntime, lightgbm, joblib, mlflow"

          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          DIGEST_REF: ${{ steps.verify.outputs.digest_ref }}
          RELEASE_IMAGE_TAG: ${{ steps.source-ref.outputs.release_image_tag }}
          SHA_REF: ${{ steps.image.outputs.sha_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## Autoresearch training image"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Immutable tag: \`$SHA_REF\`"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "- Release tag: \`$RELEASE_IMAGE_TAG\`"
            fi
            echo "- Deployable digest: \`$DIGEST_REF\`"
            echo
            echo "Existing registry digests are retained as rollback candidates."
          } >> "$GITHUB_STEP_SUMMARY"

