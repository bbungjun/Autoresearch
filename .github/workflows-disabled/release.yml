          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GAR_PUSHER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agent orchestration UI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/workbench.Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify UI digest, metadata, and runtime contract
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Agent orchestration UI build did not return a valid registry digest"
            exit 1
          fi

          digest_ref="${IMAGE_URI}@${DIGEST}"
          docker pull "$digest_ref"

          image_revision="$(docker image inspect "$digest_ref" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$SOURCE_SHA" ]]; then
            echo "::error::Agent orchestration UI OCI revision does not match checked out source SHA"
            exit 1
          fi

          image_user="$(docker image inspect "$digest_ref" --format '{{ .Config.User }}')"
          if [[ -z "$image_user" || "$image_user" == "0" || "$image_user" == "root" ]]; then
            echo "::error::Agent orchestration UI image must run as a non-root user"
            exit 1
          fi

          container_name="agent-orchestration-ui-release-verify"
          docker run --detach --name "$container_name" --publish 127.0.0.1::8501 "$digest_ref"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          host_port="$(docker port "$container_name" 8501/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/_stcore/health"; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent "http://127.0.0.1:${host_port}/_stcore/health" >/dev/null; then
            docker logs "$container_name"
            echo "::error::Streamlit UI healthcheck did not become ready"
            exit 1
          fi

          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"

      - name: Write UI release summary
        env:
          DIGEST_REF: ${{ steps.verify.outputs.digest_ref }}
          RELEASE_IMAGE_TAG: ${{ github.event.release.tag_name }}
          SHA_REF: ${{ steps.image.outputs.sha_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## Agent orchestration UI image"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Immutable tag: \`$SHA_REF\`"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "- Release tag: \`$RELEASE_IMAGE_TAG\`"
            fi
            echo "- UI digest_ref: \`$DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-agent-orchestration-digests:
    name: Promote Agent Orchestration digests to infra main
    needs:
      - publish-agent-orchestration-api-image
      - publish-agent-orchestration-executor-image
      - publish-agent-orchestration-ui-image
      - publish-agent-orchestration-launcher-image
      - publish-agent-orchestration-runner-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: agent-orchestration-infra-digest-promotion
      cancel-in-progress: false

    steps:
      - name: Create installation token for the infra repository
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Autoresearch-infra

      - name: Checkout infra main
        uses: actions/checkout@v6
        with:
          repository: SKYAHO/Autoresearch-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra-repo
          fetch-depth: 1

      - name: Update only approved immutable digest references
        env:
          API_DIGEST_REF: ${{ needs.publish-agent-orchestration-api-image.outputs.digest_ref }}
          API_SOURCE_SHA: ${{ needs.publish-agent-orchestration-api-image.outputs.source_sha }}
          EXECUTOR_DIGEST_REF: ${{ needs.publish-agent-orchestration-executor-image.outputs.digest_ref }}
          EXECUTOR_SOURCE_SHA: ${{ needs.publish-agent-orchestration-executor-image.outputs.source_sha }}
          LAUNCHER_DIGEST_REF: ${{ needs.publish-agent-orchestration-launcher-image.outputs.digest_ref }}
          LAUNCHER_SOURCE_SHA: ${{ needs.publish-agent-orchestration-launcher-image.outputs.source_sha }}
          RUNNER_DIGEST_REF: ${{ needs.publish-agent-orchestration-runner-image.outputs.digest_ref }}
          RUNNER_SOURCE_SHA: ${{ needs.publish-agent-orchestration-runner-image.outputs.source_sha }}
          UI_DIGEST_REF: ${{ needs.publish-agent-orchestration-ui-image.outputs.digest_ref }}
          UI_SOURCE_SHA: ${{ needs.publish-agent-orchestration-ui-image.outputs.source_sha }}
        shell: bash
        run: |
          if [[ "$API_SOURCE_SHA" != "$UI_SOURCE_SHA" ]] \
            || [[ "$API_SOURCE_SHA" != "$LAUNCHER_SOURCE_SHA" ]] \
            || [[ "$API_SOURCE_SHA" != "$RUNNER_SOURCE_SHA" ]] \
            || [[ "$API_SOURCE_SHA" != "$EXECUTOR_SOURCE_SHA" ]]; then
            echo "::error::Agent Orchestration image의 source SHA가 일치하지 않습니다."
            exit 1
          fi
          ruby infra-repo/scripts/promote-agent-orchestration-digests.rb

      - name: Verify promotion change scope
        id: changed
        shell: bash
        run: |
          cd infra-repo
          # infra의 `scripts/promote-agent-orchestration-digests.rb`가 고치도록 등록한
          # 파일 집합과 **정확히 같아야 한다.** 그 스크립트의 TARGETS에 파일이 늘면
          # 여기도 같이 늘려야 하며, 어긋나면 이 가드가 정상 승격을 거부해 Agent
          # Orchestration 배포가 통째로 막힌다(#653).
          #
          # 아래 경로는 **Autoresearch-infra 트리 기준**이다(하이픈 표기에 주의 —
          # 이 저장소의 deployment/experiment_platform/ 과 다른 대상이다). #754 의
          # deploy/ → deployment/ 이동은 이 저장소에만 적용되므로 여기는 그대로 둔다.
          allowed_paths=(
            deploy/agent-orchestration/api-deployment.yaml
            deploy/agent-orchestration/api-migration-job.yaml
            deploy/agent-orchestration/launcher-cronjob.yaml
            # API image와 launcher image가 둘 다 이 파일을 고친다(#616).
            deploy/agent-orchestration/log-collector-deployment.yaml
            deploy/agent-orchestration/runner-deployment.yaml
            deploy/agent-orchestration/deployment-verification-job.yaml
            deploy/agent-orchestration/ui-deployment.yaml
            # log-collector와 같은 launcher image를 쓰는 PR 생성기다(#689/#700).
            deploy/agent-orchestration/pull-request-opener-deployment.yaml
          )
          git add -- "${allowed_paths[@]}"
          mapfile -t changed_paths < <(git diff --cached --name-only)
          mapfile -t status_lines < <(git status --porcelain)
          for status_line in "${status_lines[@]}"; do
            changed_path="${status_line:3}"
            allowed=false
            for allowed_path in "${allowed_paths[@]}"; do
              if [[ "$changed_path" == "$allowed_path" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != "true" ]]; then
              echo "::error::허용되지 않은 파일 변경을 감지했습니다: $changed_path"
              exit 1
            fi
          done
          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for changed_path in "${changed_paths[@]}"; do
            allowed=false
            for allowed_path in "${allowed_paths[@]}"; do
              if [[ "$changed_path" == "$allowed_path" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != "true" ]]; then
              echo "::error::허용되지 않은 파일 변경을 감지했습니다: $changed_path"
              exit 1
            fi
          done
          git diff --cached --check
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push promoted digests
        if: steps.changed.outputs.updated == 'true'
        env:
          SOURCE_SHA: ${{ needs.publish-agent-orchestration-api-image.outputs.source_sha }}
        shell: bash
        run: |
          cd infra-repo
          base_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$base_sha" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::infra main이 checkout 이후 변경되었습니다. 다음 release 실행에서 재시도합니다."
            exit 1
          fi
          git config user.name "autoresearch-release-bot[bot]"
          git config user.email "autoresearch-release-bot[bot]@users.noreply.github.com"
          git commit -m "chore: Agent Orchestration digest 자동 승격 (${SOURCE_SHA:0:12})"
          git push origin HEAD:main

      - name: Write promotion summary
        env:
          API_DIGEST_REF: ${{ needs.publish-agent-orchestration-api-image.outputs.digest_ref }}
          EXECUTOR_DIGEST_REF: ${{ needs.publish-agent-orchestration-executor-image.outputs.digest_ref }}
          LAUNCHER_DIGEST_REF: ${{ needs.publish-agent-orchestration-launcher-image.outputs.digest_ref }}
          RUNNER_DIGEST_REF: ${{ needs.publish-agent-orchestration-runner-image.outputs.digest_ref }}
          SOURCE_SHA: ${{ needs.publish-agent-orchestration-api-image.outputs.source_sha }}
          UI_DIGEST_REF: ${{ needs.publish-agent-orchestration-ui-image.outputs.digest_ref }}
          UPDATED: ${{ steps.changed.outputs.updated }}
        shell: bash
        run: |
          {
            echo "## Agent Orchestration infra digest promotion"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- API digest: \`$API_DIGEST_REF\`"
            echo "- Executor digest: \`$EXECUTOR_DIGEST_REF\`"
            echo "- Launcher digest: \`$LAUNCHER_DIGEST_REF\`"
            echo "- Runner digest: \`$RUNNER_DIGEST_REF\`"
            echo "- UI digest: \`$UI_DIGEST_REF\`"
            if [[ "$UPDATED" == "true" ]]; then
              echo "- Result: infra main digest 참조를 자동 갱신했습니다."
            else
              echo "- Result: 이미 같은 digest여서 변경하지 않았습니다."
            fi
            echo "- Release workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-agent-orchestration-runner-image:
    name: Build, push, and verify agent orchestration Runner image
    needs: publish-application-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest_ref: ${{ steps.verify.outputs.digest_ref }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish-application-image.outputs.source_sha }}
          fetch-depth: 1

      - name: Record checked out source SHA
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.publish-application-image.outputs.source_sha }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full commit SHA"
            exit 1
          fi
          if [[ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Agent orchestration Runner checkout does not match the application source SHA"
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          WIF_PROVIDER_ID: ${{ vars.WIF_PROVIDER_ID }}
          GAR_PUSHER_SA: ${{ secrets.GAR_PUSHER_SA }}
        shell: bash
        run: |
          for variable_name in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY WIF_PROVIDER_ID GAR_PUSHER_SA; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured"
              exit 1
            fi
          done

      - name: Resolve Runner image references
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          RELEASE_IMAGE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source SHA must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ -n "$RELEASE_IMAGE_TAG" && ! "$RELEASE_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release tag is not a valid Docker tag"
            exit 1
          fi

          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/autoresearch-agent-orchestration-runner"
          sha_ref="${image_uri}:sha-${SOURCE_SHA}"

          {
            echo "tags<<EOF"
            echo "$sha_ref"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "${image_uri}:${RELEASE_IMAGE_TAG}"
            fi
            echo "EOF"
            echo "uri=$image_uri"
            echo "sha_ref=$sha_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GAR_PUSHER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agent orchestration Runner image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/runner.Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify Runner digest, metadata, and execution contract
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Agent orchestration Runner build did not return a valid registry digest"
            exit 1
          fi

          digest_ref="${IMAGE_URI}@${DIGEST}"
          docker pull "$digest_ref"

          image_revision="$(docker image inspect "$digest_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$SOURCE_SHA" ]]; then
            echo "::error::Agent orchestration Runner OCI revision does not match checked out source SHA"
            exit 1
          fi

          image_user="$(docker image inspect "$digest_ref" --format '{{ .Config.User }}')"
          if [[ -z "$image_user" || "$image_user" == "0" || "$image_user" == "root" ]]; then
            echo "::error::Agent orchestration Runner image must run as a non-root user"
            exit 1
          fi

          codex_version="$(docker run --rm "$digest_ref" codex --version)"
          if [[ "$codex_version" != "codex-cli 0.146.0" ]]; then
            echo "::error::Agent orchestration Runner Codex version is unexpected"
            exit 1
          fi
          docker run --rm "$digest_ref" python -c "import applications.experiment_platform.runner.app"

          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"

      - name: Write Runner release summary
        env:
          DIGEST_REF: ${{ steps.verify.outputs.digest_ref }}
          RELEASE_IMAGE_TAG: ${{ github.event.release.tag_name }}
          SHA_REF: ${{ steps.image.outputs.sha_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## Agent orchestration Runner image"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Immutable tag: \`$SHA_REF\`"
            if [[ -n "$RELEASE_IMAGE_TAG" ]]; then
              echo "- Release tag: \`$RELEASE_IMAGE_TAG\`"
            fi
            echo "- Runner digest_ref: \`$DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

