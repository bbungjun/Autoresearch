name: Python CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # PR은 새 커밋이 이전 실행을 대체한다. main은 각 push의 변경 범위가 다르므로
  # run별 그룹으로 분리해 실행 중·대기 중 검증이 다른 push에 밀려 사라지지 않게 한다.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter 가 pull_request 이벤트에서 변경 파일 목록을 GitHub API
  # (listFiles) 로 조회한다. permissions 블록을 명시하면 그 목록이 곧 전체 권한이
  # 되므로 contents 만 두면 `Resource not accessible by integration` 으로 실패한다 (#5).
  pull-requests: read

jobs:
  changes:
    name: Detect changed image dependencies
    runs-on: ubuntu-latest
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app }}
      train: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.train }}
      mlflow: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mlflow }}
      feast: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.feast }}
      serving: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.serving }}
      experiment_platform: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.experiment_platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        # PR은 GitHub API, main push는 before..sha 전체 구간을 비교한다.
        # 수동 실행은 outputs에서 모든 이미지를 선택한다.
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          # 최초 main push의 0 SHA는 base와 ref 모두 같은 기본 브랜치로 주어
          # dorny의 초기 push 분기에서 전체 파일을 검사한다.
          base: ${{ github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' && github.ref || github.event.before) || '' }}
          ref: ${{ github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' && github.ref || github.sha) || '' }}
          # '.github/workflows/ci.yml'과 '.dockerignore'는 9개 이미지 전부의 빌드
          # 인자·컨텍스트를 결정하므로 모든 필터에 공통으로 넣는다(누락 시 이
          # 워크플로우 자체를 고친 PR이 어떤 이미지 검증도 없이 통과한다 — 이 PR의
          # 최초 버전이 그 사례였다). 새 공용 의존 경로를 추가할 때는 6개 목록을
          # 모두 갱신해야 한다.
          filters: |
            app:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'deployment/Dockerfile.app'
              - 'scripts/gcs_code_bootstrap.sh'
              - 'autoresearch/**'
              - 'pyproject.toml'
              - 'uv.lock'
            train:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'deployment/Dockerfile.train'
              - 'scripts/gcs_code_bootstrap.sh'
              - 'autoresearch/**'
              - 'pyproject.toml'
              - 'uv.lock'
            mlflow:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'deployment/mlflow/**'
            feast:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'deployment/Dockerfile.feast'
              - 'scripts/gcs_code_bootstrap.sh'
              - 'autoresearch/**'
              - 'feature_repo/**'
              - 'pyproject.toml'
              - 'uv.lock'
            serving:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'deployment/serving/**'
              - 'applications/__init__.py'
              - 'applications/reranking_api/**'
              - 'autoresearch/**'
              - 'feature_repo/**'
              - 'pyproject.toml'
              - 'uv.lock'
            experiment_platform:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - '.streamlit/**'
              - 'applications/__init__.py'
              - 'applications/experiment_platform/**'
              - 'deployment/experiment_platform/**'
              - 'tools/__init__.py'
              - 'tools/auto_research_issue_branch.py'
              - 'pyproject.toml'
              - 'uv.lock'

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # uv 버전을 고정해 lock/export 포맷이 로컬과 어긋나지 않게 한다.
          version: "0.11.26"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        # Public ubuntu-latest의 4 vCPU와 로컬 n=2/n=4 비교를 근거로 worker를 고정한다.
        # 같은 파일의 테스트 순서는 보존하고, durations는 후속 병목 근거로 남긴다.
        run: uv run --no-sync python -m pytest -n 4 --dist loadfile --durations=25

  pytest-feast:
    name: pytest (feast group)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # feast 그룹은 dev 그룹과 충돌하므로 --no-dev 로 격리 설치한다.
        run: uv sync --frozen --no-dev --group feast

      - name: Run feast pytest
        run: >-
          uv run --no-sync python -m pytest
          tests/test_redis_iam.py
          tests/jobs/test_feast_materialize.py
          tests/applications/reranking_api/test_serving_feast_reader.py
          tests/applications/reranking_api/test_serving_feast_reader_feast.py
          tests/test_offline_retrieval_smoke_feast.py
          tests/feature_engineering/test_odfv_category_match_feast.py
          tests/test_odfv_registry_portability_feast.py
          tests/feature_engineering/test_verify_registry_portability_feast.py
          tests/feature_engineering/test_feast_retrieval_integration_feast.py
          tests/model_training/test_build_training_dataset_env_check_feast.py
          tests/applications/reranking_api/test_serving_api.py
          tests/applications/reranking_api/test_serving_deployment.py
          -v

  pytest-postgres:
    name: pytest (postgres group)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: orch
          POSTGRES_PASSWORD: orch
          POSTGRES_DB: orch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORCH_TEST_POSTGRES_URL: postgresql://orch:orch@localhost:5432/orch_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply Alembic migrations to the ephemeral PostgreSQL service
        env:
          ORCH_DATABASE_URL: ${{ env.ORCH_TEST_POSTGRES_URL }}
        run: uv run --no-sync alembic -c applications/experiment_platform/alembic.ini upgrade head

      - name: Run PostgreSQL concurrency contract tests
        run: uv run --no-sync python -m pytest tests/applications/experiment_platform/test_experiment_postgres.py -v

  uv-lock-check:
    name: uv lock & proxy export drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Verify MLflow runtime uv.lock matches pyproject.toml
        # deployment/mlflow/runtime은 루트 프로젝트와 분리된 독립 manifest/lockfile이라
        # 루트 uv lock --check로는 drift가 잡히지 않는다.
        run: cd deployment/mlflow/runtime && uv lock --check

      - name: Verify exported youtube_api_proxy requirements.txt matches uv.lock
        # applications/youtube_api_proxy/requirements.txt(Cloud Run, 깨끗한 python-slim 베이스)는
        # uv.lock 에서 생성되는 전핀 산출물이다. 재생성 후 diff 로 drift 를 검사한다.
        run: |
          uv export --frozen --only-group proxy --no-hashes -o applications/youtube_api_proxy/requirements.txt
          git diff --exit-code applications/youtube_api_proxy/requirements.txt

  docker-build-app:
    name: Docker build (app)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # uv.lock 기반 canonical application image만 검증한다.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.app
          tags: autoresearch:ci
          build-args: VCS_REF=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=ci-app
          # 캐시는 최적화 수단이다. export 지연/실패가 이미지 실행 검증을 막지 않는다.
          cache-to: type=gha,scope=ci-app,mode=max,timeout=5m,ignore-error=true

      - name: Verify the image ships no application source
        # #750: 코드는 GCS 아카이브로 배포한다. 소스가 이미지에 남으면
        # 부트스트랩이 푼 코드와 구워진 코드가 공존해 어느 쪽이 실행되는지
        # 알 수 없게 된다.
        run: |
          if docker run --rm --entrypoint sh autoresearch:ci \
            -c 'test -e /app/autoresearch || test -e /app/src'; then
            echo "::error::애플리케이션 소스가 이미지에 포함되어 있다"
            exit 1
          fi

      - name: Run Docker image smoke check
        # 코드가 이미지에 없으므로 로컬 아카이브 주입 모드로 부트스트랩
        # 압축 해제·실행 경로를 검증한다 (deployment/Dockerfile.train과 동일 패턴).
        run: |
          git archive --format=tar.gz -o /tmp/code-archive.tar.gz HEAD
          run_batch() {
            docker run --rm \
              -v /tmp/code-archive.tar.gz:/tmp/code-archive.tar.gz:ro \
              -e CODE_ARCHIVE_LOCAL_PATH=/tmp/code-archive.tar.gz \
              autoresearch:ci "$@"
          }
          run_batch
          for module in \
            autoresearch.jobs.youtube_trending \
            autoresearch.jobs.youtube_backfill \
            autoresearch.jobs.action_log \
            autoresearch.jobs.action_log_quality \
            autoresearch.recommendation.daily_recommendations
          do
            run_batch python -m "$module" --help
            run_batch python -m "$module" --version
          done
          if docker run --rm autoresearch:ci 2>/dev/null; then
            echo "::error::부트스트랩이 env 없이 성공해서는 안 된다"
            exit 1
          fi

  docker-build-train:
    name: Docker build (train)
    needs: changes
    if: needs.changes.outputs.train == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build training image
        # CTR 학습 파이프라인을 담는 이미지. deployment/Dockerfile.app과 별도로 관리한다 —
        # 배치 CLI(autoresearch/jobs/)와 학습 코드(autoresearch/model_training/)는
        # 책임이 다르다.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.train
          tags: autoresearch-training:ci
          build-args: VCS_REF=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=ci-train
          cache-to: type=gha,scope=ci-train,mode=max,timeout=5m,ignore-error=true

      - name: Run training image smoke check
        # 코드가 이미지에 없으므로 로컬 아카이브 주입 모드로 부트스트랩
        # 압축 해제·실행 경로를 검증한다 (deployment/Dockerfile.feast와 동일 패턴).
        # build-features/run-pipeline은 #359 C2에서 feast offline PIT로 조립하도록
        # 바뀌어 deployment/Dockerfile.feast로 실행한다 — feast를 담지 않는 이 train 이미지에서는
        # 런타임에 feast import가 터지므로, 여기서 --help로 스모크하지 않는다(거짓 green
        # 방지). 이 이미지가 실제로 실행하는 feast 불필요 서브커맨드만 검증한다.
        run: |
          git archive --format=tar.gz -o /tmp/code-archive.tar.gz HEAD
          run_training() {
            docker run --rm \
              -v /tmp/code-archive.tar.gz:/tmp/code-archive.tar.gz:ro \
              -e CODE_ARCHIVE_LOCAL_PATH=/tmp/code-archive.tar.gz \
              autoresearch-training:ci "$@"
          }
          run_training
          run_training python -m autoresearch.cli train-model --help
          run_training python -m autoresearch.cli evaluate-model --help
          run_training python -m autoresearch.cli promote-model --help
          if docker run --rm autoresearch-training:ci 2>/dev/null; then
            echo "::error::부트스트랩이 env 없이 성공해서는 안 된다"
            exit 1
          fi

  docker-build-mlflow:
    name: Docker build (mlflow)
    needs: changes
    if: needs.changes.outputs.mlflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MLflow runtime image
        # deployment/mlflow/runtime의 uv.lock 기반 최소 파생 이미지를 검증한다.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/mlflow/Dockerfile
          tags: mlflow-runtime:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-mlflow
          cache-to: type=gha,scope=ci-mlflow,mode=max,timeout=5m,ignore-error=true

      - name: Run MLflow runtime import smoke check
        # Dockerfile RUN이 캐시에서 복원되어도 실제 로드한 이미지에서 import를 검증한다.
        run: |
          docker run --rm --entrypoint python mlflow-runtime:ci \
            -c "import psycopg2; import boto3; import google.cloud.storage"

  docker-build-feast:
    name: Docker build (feast)
    needs: changes
    if: needs.changes.outputs.feast == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Feast Docker image
        # feast 그룹 파생 이미지 (materialize 실행·GKE 검증용)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.feast
          tags: autoresearch-feast:ci
          build-args: VCS_REF=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=ci-feast
          cache-to: type=gha,scope=ci-feast,mode=max,timeout=5m,ignore-error=true

      - name: Run Feast Docker image smoke check
        # 코드가 이미지에 없으므로 로컬 아카이브 주입 모드로 부트스트랩
        # 압축 해제·실행 경로를 검증한다.
        run: |
          git archive --format=tar.gz -o /tmp/code-archive.tar.gz HEAD
          run_feast() {
            docker run --rm \
              -v /tmp/code-archive.tar.gz:/tmp/code-archive.tar.gz:ro \
              -e CODE_ARCHIVE_LOCAL_PATH=/tmp/code-archive.tar.gz \
              autoresearch-feast:ci "$@"
          }
          run_feast
          run_feast python -m autoresearch.jobs.feast_materialize --help
          run_feast python -m autoresearch.jobs.feast_materialize --version
          # #359 C2로 학습 run-pipeline이 이 이미지로 옮겨왔으므로 여기서 스모크한다
          # (train 이미지는 위에서 더 이상 스모크하지 않는다). --help는 커맨드 본문을
          # 실행하지 않지만 autoresearch.cli의 모듈 최상단 import(build_training_dataset/train/
          # evaluate -> lightgbm)를 전부 태우므로, #401(libgomp1)처럼 import 시점에
          # 드러나는 누락을 잡는다.
          # 한계: 함수 안에서 지연 import되는 것(convert_lgbm_to_onnx의 onnxmltools 등)은
          # 이 체인에 안 걸린다. 그 계열은 release.yml의 feast 이미지 verify가 명시적
          # import로 따로 지킨다.
          run_feast python -m autoresearch.cli run-pipeline --help
          if docker run --rm autoresearch-feast:ci 2>/dev/null; then
            echo "::error::부트스트랩이 env 없이 성공해서는 안 된다"
            exit 1
          fi

  docker-build-serving:
    name: Docker build (serving)
    needs: changes
    if: needs.changes.outputs.serving == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/serving/Dockerfile
          tags: autoresearch-serving:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-serving
          cache-to: type=gha,scope=ci-serving,mode=max,timeout=5m,ignore-error=true

      - name: Run serving image import smoke check
        run: |
          docker run --rm autoresearch-serving:ci python -m pip check
          docker run --rm autoresearch-serving:ci \
            python -c "import lightgbm, feast, fastapi, feature_repo.redis_iam, applications.reranking_api.app"
          docker run --rm autoresearch-serving:ci \
            python -c "from feature_repo.bootstrap import load_feature_store; load_feature_store('/app/feature_repo')"

      - name: Run serving image fail-closed HTTP contract smoke
        shell: bash
        run: |
          container_name="autoresearch-serving-healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${container_name}" \
            --publish 127.0.0.1::8000 \
            autoresearch-serving:ci

          for _ in $(seq 1 30); do
            host_port="$(docker port "${container_name}" 8000/tcp | awk -F: '{print $NF}')"
            rerank_status_code="$(curl --request POST \
              --silent --show-error \
              --output /tmp/serving-rerank.json \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "http://127.0.0.1:${host_port}/rerank" || true)"
            healthcheck_status_code="$(curl --silent --show-error --output /tmp/serving-healthcheck.json --write-out '%{http_code}' "http://127.0.0.1:${host_port}/healthcheck" || true)"
            if [ "${rerank_status_code}" = "422" ] && [ "${healthcheck_status_code}" = "503" ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "${container_name}"
          echo "::error::모델·Feast 자격 증명 없이 malformed /rerank는 422이고 /healthcheck는 503이어야 한다"
          exit 1

  docker-build-agent-orchestration:
    name: Docker build (agent orchestration)
    needs: changes
    if: needs.changes.outputs.experiment_platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent Orchestration API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/api.Dockerfile
          tags: autoresearch-agent-orchestration-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-agent-api
          cache-to: type=gha,scope=ci-agent-api,mode=max,timeout=5m,ignore-error=true

      - name: Build Agent Orchestration Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/runner.Dockerfile
          tags: autoresearch-agent-orchestration-runner:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-agent-runner
          cache-to: type=gha,scope=ci-agent-runner,mode=max,timeout=5m,ignore-error=true

      - name: Build Agent Orchestration UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/workbench.Dockerfile
          tags: autoresearch-agent-orchestration-ui:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-agent-workbench
          cache-to: type=gha,scope=ci-agent-workbench,mode=max,timeout=5m,ignore-error=true

      - name: Build Agent Orchestration Executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/experiment_platform/executor.Dockerfile
          tags: autoresearch-agent-orchestration-executor:ci
          load: true
          push: false
          cache-from: type=gha,scope=ci-agent-executor
          cache-to: type=gha,scope=ci-agent-executor,mode=max,timeout=5m,ignore-error=true

      - name: Run Agent Orchestration image smoke checks
        run: |
          docker run --rm autoresearch-agent-orchestration-api:ci id -u | grep --fixed-strings 10001
          docker run --rm autoresearch-agent-orchestration-api:ci sh -ec '
            ! command -v codex >/dev/null 2>&1
            ! command -v node >/dev/null 2>&1
            test ! -e "${CODEX_HOME:-/var/lib/codex}/auth.json"
            test ! -e /var/lib/codex/auth.json
          '
          docker run --rm autoresearch-agent-orchestration-api:ci \
            python -c "import applications.experiment_platform.api.main"
          docker run --rm autoresearch-agent-orchestration-api:ci gh --version \
            | grep --fixed-strings "gh version 2.97.0"
          docker run --rm autoresearch-agent-orchestration-api:ci \
            python -c "import applications.experiment_platform.shared.bootstrap_secrets; from google.cloud import secretmanager"
          docker run --rm autoresearch-agent-orchestration-api:ci \
            python -c "import importlib.util; assert importlib.util.find_spec('lightgbm') is None"
          docker run --rm autoresearch-agent-orchestration-api:ci \
            alembic -c applications/experiment_platform/alembic.ini upgrade head --sql >/dev/null
          docker run --rm autoresearch-agent-orchestration-runner:ci id -u | grep --fixed-strings 10001
          codex_version="$(docker run --rm autoresearch-agent-orchestration-runner:ci codex --version)"
          test "${codex_version}" = "codex-cli 0.146.0"
          docker run --rm autoresearch-agent-orchestration-runner:ci \
            python -c "import applications.experiment_platform.runner.app"
          docker run --rm autoresearch-agent-orchestration-runner:ci \
            python -c "import importlib.util; assert importlib.util.find_spec('lightgbm') is None"
          mkdir -p /tmp/executor-runtime-clone/tools
          printf 'raise RuntimeError("runtime clone tools must not be imported")\n' \
            > /tmp/executor-runtime-clone/tools/__init__.py
          docker run --rm --read-only \
            -v /tmp/executor-runtime-clone/tools:/workspace/repository/tools:ro \
            autoresearch-agent-orchestration-executor:ci sh -ec '
              test "$(id -u)" = "10001"
              test "$(id -g)" = "10001"
              test "$UV_PROJECT_ENVIRONMENT" = "/opt/autoresearch-venv"
              git --version
              uv --version
              node --version
              codex --version
              python -c "import tools; assert tools.__file__ == \"/app/tools/__init__.py\"; import applications.experiment_platform.executor.main, applications.experiment_platform.executor.token_minter, applications.experiment_platform.executor.workspace, applications.experiment_platform.executor.codex_worker, applications.experiment_platform.executor.verifier, applications.experiment_platform.executor.finalizer, applications.experiment_platform.executor.phase2"
            '
          docker run --rm autoresearch-agent-orchestration-ui:ci id -u | grep --fixed-strings 10001
          container_name="agent-orchestration-ui-ci"
          docker run --detach --name "$container_name" --publish 127.0.0.1::8501 \
            autoresearch-agent-orchestration-ui:ci
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          host_port="$(docker port "$container_name" 8501/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/_stcore/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          echo "::error::Streamlit UI healthcheck did not become ready"
          exit 1

  docker-build:
    name: Docker build
    # 브랜치 룰셋의 필수 상태 체크가 "Docker build" 컨텍스트 이름을 그대로 요구한다.
    # 서브잡 6개로 쪼갠 뒤에도 이 이름을 보고해야 하므로, 결과를 모으는 fan-in
    # 집계 잡을 이 이름으로 유지한다(룰셋 수정 불필요).
    needs:
      - changes
      - docker-build-app
      - docker-build-train
      - docker-build-mlflow
      - docker-build-feast
      - docker-build-serving
      - docker-build-agent-orchestration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if changes job failed or any sub-build did not succeed
        # changes 잡이 실패하면(checkout·paths-filter 다운로드·filters YAML 파싱
        # 실패 등) 서브잡 6개의 if 조건(needs.changes.outputs.*)이 전부 비어
        # false로 평가되어 skipped가 된다 — failure가 아니므로 아래 조건만으로는
        # 못 잡는다. changes.result를 별도로 확인해야 "빌드 0개인데 green"을 막는다.
        # cancelled도 failure와 동일하게 취급한다(러너 회수 등으로 서브잡이 취소돼도
        # 필수 체크가 green이 되면 안 된다).
        if: |
          needs.changes.result != 'success' ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-app.result) ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-train.result) ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-mlflow.result) ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-feast.result) ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-serving.result) ||
          contains(fromJSON('["failure", "cancelled"]'), needs.docker-build-agent-orchestration.result)
        run: |
          echo "::error::changes 잡 실패 또는 하나 이상의 Docker build 서브잡이 실패/취소되었습니다"
          exit 1
